<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpsHub — Super Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════
   OPSHUB v2 — SUPER ADMIN PANEL
   Design: Neumorphism Skill · Icon Design Skill
   Surface: #E7E5E4 · Primary: #006666 · Font: Space Mono
   NO dark theme · Light neumorphic throughout
═══════════════════════════════════════════════════════════ */
:root{
  /* Neumorphic surface */
  --base:#E7E5E4;--base-dk:#D4D2D1;--base-lt:#F5F3F2;
  --raise:6px 6px 16px rgba(0,0,0,.18),-6px -6px 16px rgba(255,255,255,.88);
  --raise-sm:3px 3px 8px rgba(0,0,0,.15),-3px -3px 8px rgba(255,255,255,.85);
  --raise-lg:10px 10px 28px rgba(0,0,0,.20),-10px -10px 28px rgba(255,255,255,.90);
  --inset:inset 4px 4px 10px rgba(0,0,0,.13),inset -4px -4px 10px rgba(255,255,255,.75);
  --inset-sm:inset 2px 2px 6px rgba(0,0,0,.10),inset -2px -2px 6px rgba(255,255,255,.70);
  --flat:2px 2px 5px rgba(0,0,0,.12),-2px -2px 5px rgba(255,255,255,.75);
  /* Brand */
  --primary:#006666;--primary-h:#008080;--primary-pale:rgba(0,102,102,.1);
  --accent:#F1A500;--accent-pale:rgba(241,165,0,.12);
  --success:#00A63D;--danger:#FF2157;--warning:#FE9900;--info:#0075CC;
  /* Semantic colours (SaaS status) */
  --c-active:#006666;--c-trial:#D97706;--c-suspended:#FF2157;--c-pending:#0075CC;
  /* Text */
  --text:#1E2938;--text2:rgba(30,41,56,.58);--text3:rgba(30,41,56,.35);
  /* Font */
  --font:'Space Mono','Courier New',monospace;--mono:'JetBrains Mono','Fira Code',monospace;
  /* Layout */
  --sidebar:220px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100vh;font-family:var(--font);color:var(--text);background:var(--base);font-size:13px;-webkit-font-smoothing:antialiased}
button{font-family:var(--font);cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:var(--font);outline:none;border:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--base-dk);border-radius:4px}

/* ── LAYOUT ── */
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar);flex-shrink:0;background:var(--base-dk);display:flex;flex-direction:column;padding:0 0 20px;position:fixed;left:0;top:0;bottom:0;z-index:100;overflow-y:auto}
#main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-height:100vh}

/* ── SIDEBAR ── */
.sb-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(0,0,0,.08)}
.sb-logo-mark{display:flex;align-items:center;gap:10px}
.sb-logo-icon{width:36px;height:36px;border-radius:10px;background:var(--primary);box-shadow:var(--raise-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-logo-text{font-size:15px;font-weight:700;color:var(--primary);letter-spacing:-.5px}
.sb-logo-sub{font-size:9px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
.sb-badge{font-size:8px;background:var(--danger);color:#fff;padding:1px 5px;border-radius:4px;font-family:var(--mono);font-weight:700;margin-left:4px}

.sb-section{padding:14px 12px 4px;font-size:9px;font-family:var(--mono);font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 14px;margin:1px 8px;border-radius:10px;cursor:pointer;color:var(--text2);font-size:12px;font-weight:700;transition:all .2s;position:relative;user-select:none}
.nav-item:hover{color:var(--text);background:rgba(0,0,0,.04)}
.nav-item.active{background:var(--base);box-shadow:var(--raise-sm);color:var(--primary)}
.nav-item .ni-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:inherit}
.nav-item .ni-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:9px;font-family:var(--mono);font-weight:700;padding:1px 6px;border-radius:6px;min-width:18px;text-align:center}
.nav-item .ni-badge.info{background:var(--info)}
.nav-item .ni-badge.warn{background:var(--warning);color:#1E2938}

.sb-bottom{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(0,0,0,.07)}

/* ── HEADER ── */
#header{height:56px;background:var(--base);border-bottom:1px solid rgba(0,0,0,.07);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:90;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hdr-title{font-size:14px;font-weight:700;color:var(--text)}
.hdr-sub{font-size:11px;color:var(--text3);font-family:var(--mono)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.hdr-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);box-shadow:var(--raise-sm);display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ── CONTENT ── */
#content{flex:1;padding:20px 24px;overflow-y:auto}

/* ── CARDS ── */
.card{background:var(--base);border-radius:14px;box-shadow:var(--raise);padding:18px}
.card-sm{padding:14px}
.card-flat{box-shadow:var(--flat)}
.card-inset{box-shadow:var(--inset)}
.card-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title-accent{width:3px;height:14px;border-radius:2px;background:var(--primary)}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi-card{background:var(--base);border-radius:14px;box-shadow:var(--raise);padding:16px 18px;border-left:3px solid transparent;position:relative;overflow:hidden;transition:transform .15s}
.kpi-card:hover{transform:translateY(-2px)}
.kpi-card:nth-child(1){border-left-color:var(--primary)}
.kpi-card:nth-child(2){border-left-color:var(--accent)}
.kpi-card:nth-child(3){border-left-color:#00A63D}
.kpi-card:nth-child(4){border-left-color:#0075CC}
.kpi-label{font-size:10px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-val{font-size:26px;font-weight:700;color:var(--text);letter-spacing:-1px;line-height:1}
.kpi-sub{font-size:10px;color:var(--text2);margin-top:4px;font-family:var(--mono)}
.kpi-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.12;width:36px;height:36px}

/* ── TABLES ── */
.tbl-wrap{border-radius:12px;box-shadow:var(--inset-sm);overflow:hidden;background:var(--base-lt)}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--base-dk)}
th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
td{padding:11px 14px;font-size:12px;color:var(--text);border-bottom:1px solid rgba(0,0,0,.05)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(0,0,0,.02)}
.td-mono{font-family:var(--mono);font-size:11px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:.4px}
.badge-active{background:rgba(0,166,61,.12);color:#065F46}
.badge-trial{background:rgba(217,119,6,.12);color:#92400E}
.badge-suspended{background:rgba(255,33,87,.12);color:#9F1239}
.badge-pending{background:rgba(0,117,204,.12);color:#1D4ED8}
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:700;background:var(--base);box-shadow:var(--raise-sm);color:var(--text);cursor:pointer;transition:all .15s;border:none;font-family:var(--font)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--raise)}
.btn:active{box-shadow:var(--inset-sm);transform:translateY(0)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:3px 3px 10px rgba(0,102,102,.35),-3px -3px 10px rgba(255,255,255,.5)}
.btn-primary:hover{background:var(--primary-h);box-shadow:4px 4px 14px rgba(0,102,102,.45),-4px -4px 14px rgba(255,255,255,.6)}
.btn-danger{background:var(--danger);color:#fff}
.btn-warn{background:var(--warning);color:#1E2938}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:8px}
.btn-xs{padding:3px 8px;font-size:10px;border-radius:6px}

/* ── INPUTS ── */
.form-row{display:grid;gap:12px;margin-bottom:14px}
.form-row.cols-2{grid-template-columns:1fr 1fr}
.form-row.cols-3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:10px;font-weight:700;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
.form-input{background:var(--base);box-shadow:var(--inset-sm);border-radius:9px;padding:9px 12px;font-size:12px;color:var(--text);font-family:var(--font);transition:box-shadow .15s;width:100%}
.form-input:focus{box-shadow:var(--inset),0 0 0 2px var(--primary-pale)}
.form-select{background:var(--base);box-shadow:var(--inset-sm);border-radius:9px;padding:9px 12px;font-size:12px;color:var(--text);font-family:var(--font);appearance:none;width:100%;cursor:pointer}

/* ── MODAL ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(30,41,56,.35);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--base);border-radius:18px;box-shadow:var(--raise-lg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:24px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:14px;font-weight:700;color:var(--text)}
.modal-close{width:28px;height:28px;border-radius:8px;background:var(--base);box-shadow:var(--raise-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:14px;border:none;font-family:var(--font)}

/* ── SEARCH ── */
.search-wrap{position:relative;flex:1;max-width:320px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.search-input{background:var(--base);box-shadow:var(--inset-sm);border-radius:10px;padding:8px 10px 8px 34px;font-size:12px;color:var(--text);font-family:var(--font);width:100%}

/* ── STATUS PILL ── */
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.dot-active{background:var(--success)}
.dot-trial{background:var(--warning)}
.dot-suspended{background:var(--danger)}
.dot-pending{background:var(--info)}

/* ── PLAN CARDS ── */
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.plan-card{background:var(--base);border-radius:14px;box-shadow:var(--raise);padding:18px;position:relative;cursor:pointer;transition:all .2s}
.plan-card.selected{box-shadow:0 0 0 2px var(--primary),var(--raise)}
.plan-card-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
.plan-card-price{font-size:20px;font-weight:700;color:var(--primary);font-family:var(--mono)}
.plan-card-price span{font-size:11px;color:var(--text3);font-weight:400}
.plan-card-features{margin-top:12px;display:flex;flex-direction:column;gap:5px}
.plan-feat{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:6px}
.plan-feat svg{color:var(--success);flex-shrink:0}

/* ── METRIC BAR ── */
.metric-bar{background:var(--base-dk);border-radius:4px;height:6px;overflow:hidden}
.metric-fill{height:100%;border-radius:4px;background:var(--primary);transition:width .4s}

/* ── GRID HELPERS ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.flex{display:flex;align-items:center}
.flex-gap{display:flex;align-items:center;gap:8px}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.mb-16{margin-bottom:16px}.mb-12{margin-bottom:12px}.mb-20{margin-bottom:20px}
.text-muted{color:var(--text3);font-family:var(--mono);font-size:11px}
.text-sm{font-size:11px}.text-xs{font-size:10px}
.fw7{font-weight:700}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}

/* ── LOADING / SPLASH ── */
#splash{position:fixed;inset:0;background:var(--base);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#splash.gone{display:none}
.splash-logo{width:64px;height:64px;border-radius:18px;background:var(--primary);box-shadow:var(--raise-lg);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.splash-spinner{width:32px;height:3px;border-radius:4px;background:var(--base-dk);overflow:hidden;position:relative}
.splash-spinner::after{content:'';position:absolute;left:-100%;width:60%;height:100%;background:var(--primary);border-radius:4px;animation:slide 1s linear infinite}
@keyframes slide{to{left:160%}}

/* ── LOGIN ── */
#login-page{position:fixed;inset:0;background:var(--base);z-index:500;display:flex;align-items:center;justify-content:center}
#login-page.gone{display:none}
.login-card{background:var(--base);border-radius:20px;box-shadow:var(--raise-lg);padding:36px 32px;width:340px}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.login-logo-icon{width:44px;height:44px;background:var(--primary);border-radius:12px;box-shadow:var(--raise-sm);display:flex;align-items:center;justify-content:center}
.login-title{font-size:16px;font-weight:700;color:var(--text)}
.login-sub{font-size:11px;color:var(--text3);font-family:var(--mono)}

/* ── AUDIT ROW ── */
.audit-row{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.audit-row:last-child{border-bottom:none}
.audit-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:4px}
.audit-body{flex:1}
.audit-msg{font-size:12px;color:var(--text);line-height:1.4}
.audit-time{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:2px}

/* ── TABS ── */
.tabs{display:flex;gap:2px;background:var(--base-dk);border-radius:10px;padding:3px;margin-bottom:16px}
.tab{flex:1;padding:7px 12px;border-radius:8px;font-size:11px;font-weight:700;color:var(--text2);cursor:pointer;text-align:center;transition:all .15s;font-family:var(--font);border:none;background:transparent}
.tab.active{background:var(--base);box-shadow:var(--raise-sm);color:var(--primary)}

/* ── TOASTS ── */
#toast-stack{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--base);border-radius:12px;box-shadow:var(--raise);padding:12px 16px;font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:10px;animation:slideIn .25s ease;border-left:3px solid var(--primary);min-width:240px}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
@keyframes slideIn{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}

/* ── RESPONSIVE ── */
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.plan-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h7M14 17.5h7M14 21h7"/>
    </svg>
  </div>
  <div style="font-size:18px;font-weight:700;color:var(--primary)">OpsHub</div>
  <div class="text-muted">Super Admin Panel</div>
  <div class="splash-spinner"></div>
</div>

<!-- LOGIN -->
<div id="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h7M14 17.5h7M14 21h7"/>
        </svg>
      </div>
      <div>
        <div class="login-title">OpsHub</div>
        <div class="login-sub">Super Admin</div>
      </div>
    </div>
    <div class="form-group mb-16">
      <label class="form-label">Email</label>
      <input class="form-input" id="sa-email" type="email" placeholder="admin@opshub.io">
    </div>
    <div class="form-group mb-20">
      <label class="form-label">Password</label>
      <input class="form-input" id="sa-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px" onclick="doLogin()">Sign In</button>
    <div id="login-err" style="display:none;margin-top:10px;font-size:11px;color:var(--danger);text-align:center;font-family:var(--mono)"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-mark">
        <div class="sb-logo-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h7M14 17.5h7M14 21h7"/>
          </svg>
        </div>
        <div>
          <div class="sb-logo-text">OpsHub</div>
          <div class="sb-logo-sub">Super Admin</div>
        </div>
      </div>
    </div>

    <div class="sb-section">Overview</div>
    <div class="nav-item active" data-page="dashboard" onclick="navTo('dashboard')">
      <div class="ni-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/></svg></div>
      Dashboard
    </div>
    <div class="nav-item" data-page="analytics" onclick="navTo('analytics')">
      <div class="ni-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
      Analytics
    </div>

    <div class="sb-section">SaaS Management</div>
    <div class="nav-item" data-page="companies" onclick="navTo('companies')">
      <div class="ni-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      Companies
      <span class="ni-badge info" id="nb-companies">0</span>
    </div>
    <div class="nav-item" data-page="subscriptions" onclick="navTo('subscriptions')">
      <div class="ni-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></div>
      Subscriptions

<script>
/* ═══════════════════════════════════════════════════
   FIREBASE CONFIG — same database as OpsHub
═══════════════════════════════════════════════════ */
const FB_CONFIG = {
  apiKey: "AIzaSyDqhDGJCInvMMkVBCaW1f-6AFWW1gzniDQ",
  authDomain: "opshub-f802f.firebaseapp.com",
  databaseURL: "https://opshub-f802f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "opshub-f802f",
  storageBucket: "opshub-f802f.appspot.com",
  messagingSenderId: "560849491600",
  appId: "1:560849491600:web:4cb3a1a56ed7ee5f0d45ea"
};

firebase.initializeApp(FB_CONFIG);
const db = firebase.database();

/* ═══════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════ */
let SA = { session: null, page: 'dashboard' };
let DATA = {
  companies: {},   // admin/companies/{companyId}
  plans: {},       // admin/plans/{planId}
  branches: {},    // admin/branches/{branchId}
  users: {},       // admin/users/{userId}
  audit: []        // admin/audit (last 200)
};

// Super admin credentials stored in Firebase admin/superadmins
// Default bootstrap: opshub / opshub2024 (SHA-256 hashed, checked client-side for simplicity)
// For production, replace with Firebase Auth

/* ═══════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════ */
window.onload = function() {
  // Check session
  const sess = sessionStorage.getItem('sa_session');
  if (sess) {
    try { SA.session = JSON.parse(sess); showApp(); }
    catch(e) { showLogin(); }
  } else {
    showLogin();
  }
  setInterval(updateClock, 1000);
  updateClock();
};

function updateClock() {
  const el = document.getElementById('hdr-time');
  if (el) el.textContent = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}

function showLogin() {
  document.getElementById('splash').classList.add('gone');
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function showApp() {
  document.getElementById('splash').classList.add('gone');
  document.getElementById('login-page').classList.add('gone');
  document.getElementById('app').style.display = 'flex';
  loadAllData();
  navTo('dashboard');
}

function doLogin() {
  const email = document.getElementById('sa-email').value.trim();
  const pass = document.getElementById('sa-pass').value;
  if (!email || !pass) { loginErr('Enter email and password'); return; }

  // Check against Firebase admin/superadmins
  db.ref('admin/superadmins').once('value', snap => {
    const admins = snap.val() || {};
    const found = Object.values(admins).find(a => a.email === email && a.password === pass);
    if (found) {
      SA.session = { email, name: found.name || 'Super Admin', role: 'superadmin' };
      sessionStorage.setItem('sa_session', JSON.stringify(SA.session));
      logAudit('LOGIN', `Super admin ${email} signed in`);
      showApp();
    } else {
      // Bootstrap: allow opshub@opshub.io / OpsHub2024! if no admins exist
      if (Object.keys(admins).length === 0 && email === 'opshub@opshub.io' && pass === 'OpsHub2024!') {
        SA.session = { email, name: 'Super Admin', role: 'superadmin' };
        sessionStorage.setItem('sa_session', JSON.stringify(SA.session));
        // Write the first admin to Firebase
        db.ref('admin/superadmins/sa1').set({ email, password: pass, name: 'Super Admin' });
        showApp();
      } else {
        loginErr('Invalid credentials');
      }
    }
  });
}

function loginErr(msg) {
  const el = document.getElementById('login-err');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

function doLogout() {
  sessionStorage.removeItem('sa_session');
  SA.session = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-page').classList.remove('gone');
  document.getElementById('login-page').style.display = 'flex';
}

/* ═══════════════════════════════════════════════════
   DATA LOADERS
═══════════════════════════════════════════════════ */
function loadAllData() {
  db.ref('admin/companies').on('value', snap => {
    DATA.companies = snap.val() || {};
    document.getElementById('nb-companies').textContent = Object.keys(DATA.companies).length;
    if (SA.page === 'dashboard' || SA.page === 'companies') navTo(SA.page);
  });
  db.ref('admin/plans').on('value', snap => {
    DATA.plans = snap.val() || {};
    if (!Object.keys(DATA.plans).length) seedPlans();
    if (SA.page === 'plans') navTo('plans');
  });
  db.ref('admin/branches').on('value', snap => {
    DATA.branches = snap.val() || {};
    if (SA.page === 'branches') navTo('branches');
  });
  db.ref('admin/users').on('value', snap => {
    DATA.users = snap.val() || {};
    if (SA.page === 'users') navTo('users');
  });
  db.ref('admin/audit').limitToLast(200).on('value', snap => {
    DATA.audit = [];
    snap.forEach(c => DATA.audit.unshift(c.val()));
    if (SA.page === 'audit') navTo('audit');
  });
}

function seedPlans() {
  const plans = {
    starter: { id:'starter', name:'Starter', price:299, currency:'SAR', branches:1, users:5,
      modules:['branch-dash','staff','schedule','timesheet','sales','petty-cash','dsr','checklists'],
      billing:'monthly', desc:'Perfect for a single branch operation' },
    professional: { id:'professional', name:'Professional', price:799, currency:'SAR', branches:5, users:25,
      modules:['branch-dash','staff','schedule','timesheet','sales','petty-cash','dsr','checklists',
                'wastage','inv-items','inv-orders','health-cards','bm-compliance','bm-leave','training'],
      billing:'monthly', desc:'Multi-branch with full operations suite' },
    enterprise: { id:'enterprise', name:'Enterprise', price:0, currency:'SAR', branches:-1, users:-1,
      modules:['all'],
      billing:'custom', desc:'Unlimited branches, all modules, dedicated support' }
  };
  Object.values(plans).forEach(p => db.ref('admin/plans/' + p.id).set(p));
}

function logAudit(action, msg) {
  db.ref('admin/audit').push({ action, msg, ts: Date.now(), by: SA.session?.email || 'system' });
}

/* ═══════════════════════════════════════════════════
   ROUTER
═══════════════════════════════════════════════════ */
const PAGE_TITLES = {
  dashboard: ['Dashboard','Overview & KPIs'],
  analytics: ['Analytics','Platform-wide metrics'],
  companies: ['Companies','All tenant organisations'],
  subscriptions: ['Subscriptions','Billing & renewals'],
  plans: ['Plans & Pricing','Module packages'],
  users: ['Users & Roles','Cross-company users'],
  modules: ['Module Permissions','Feature toggles per company'],
  branches: ['All Branches','Every branch across companies'],
  audit: ['Audit Log','System activity trail'],
  settings: ['Settings','Platform configuration'],
};

function navTo(page) {
  SA.page = page;
  // Update nav
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  // Update header
  const [title, sub] = PAGE_TITLES[page] || [page, ''];
  document.getElementById('hdr-title').textContent = title;
  document.getElementById('hdr-sub').textContent = sub;
  // Render
  const el = document.getElementById('content');
  el.innerHTML = '';
  const renders = {
    dashboard: renderDashboard,
    analytics: renderAnalytics,
    companies: renderCompanies,
    subscriptions: renderSubscriptions,
    plans: renderPlans,
    users: renderUsers,
    modules: renderModules,
    branches: renderBranches,
    audit: renderAudit,
    settings: renderSettings,
  };
  if (renders[page]) renders[page]();
}

/* ═══════════════════════════════════════════════════
   PAGE: DASHBOARD
═══════════════════════════════════════════════════ */
function renderDashboard() {
  const companies = Object.values(DATA.companies);
  const active = companies.filter(c => c.status === 'active').length;
  const trial = companies.filter(c => c.status === 'trial').length;
  const branches = Object.values(DATA.branches).length;
  const users = Object.values(DATA.users).length;
  const mrr = companies.filter(c=>c.status==='active').reduce((sum,c)=>{
    const plan = DATA.plans[c.planId] || {};
    return sum + (plan.price||0);
  }, 0);

  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Total Companies</div>
        <div class="kpi-val">${companies.length}</div>
        <div class="kpi-sub">${active} active · ${trial} trial</div>
        <div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="36" height="36" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Monthly Revenue</div>
        <div class="kpi-val">${mrr.toLocaleString()}</div>
        <div class="kpi-sub">SAR / month (active plans)</div>
        <div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="36" height="36" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Branches</div>
        <div class="kpi-val">${branches}</div>
        <div class="kpi-sub">Across all companies</div>
        <div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="36" height="36" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Admin Users</div>
        <div class="kpi-val">${users}</div>
        <div class="kpi-sub">CEOs, directors, managers</div>
        <div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="36" height="36" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.418 3.582-7 8-7s8 2.582 8 7"/></svg></div>
      </div>
    </div>

    <div class="grid-2" style="gap:16px">
      <div class="card">
        <div class="card-title"><div class="card-title-accent"></div>Recent Companies</div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Company</th><th>Plan</th><th>Status</th><th>Branches</th></tr></thead>
            <tbody id="dash-companies-tbody"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-title"><div class="card-title-accent"></div>Recent Activity</div>
        <div id="dash-audit"></div>
      </div>
    </div>
  `;

  // Companies tbody
  const tbody = document.getElementById('dash-companies-tbody');
  const comps = Object.values(DATA.companies).slice(0,6);
  if (!comps.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text3)">No companies yet — <a href="#" onclick="navTo(\'companies\')" style="color:var(--primary)">Add first company</a></td></tr>';
  } else {
    tbody.innerHTML = comps.map(c => {
      const plan = DATA.plans[c.planId] || {};
      const branchCount = Object.values(DATA.branches).filter(b => b.companyId === c.id).length;
      return `<tr>
        <td><div style="font-weight:700">${he(c.name)}</div><div class="text-muted">${he(c.email||'')}</div></td>
        <td class="td-mono">${he(plan.name||c.planId||'-')}</td>
        <td>${statusBadge(c.status)}</td>
        <td class="td-mono">${branchCount}</td>
      </tr>`;
    }).join('');
  }

  // Audit
  const auditEl = document.getElementById('dash-audit');
  const recent = DATA.audit.slice(0,8);
  if (!recent.length) {
    auditEl.innerHTML = '<div class="text-muted" style="text-align:center;padding:20px">No activity yet</div>';
  } else {
    auditEl.innerHTML = recent.map(a => `
      <div class="audit-row">
        <div class="audit-dot"></div>
        <div class="audit-body">
          <div class="audit-msg">${he(a.msg||a.action)}</div>
          <div class="audit-time">${new Date(a.ts).toLocaleString()} · ${he(a.by||'')}</div>
        </div>
      </div>
    `).join('');
  }
}

/* ═══════════════════════════════════════════════════
   PAGE: COMPANIES
═══════════════════════════════════════════════════ */
function renderCompanies() {
  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="flex-between mb-16">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="co-search" placeholder="Search companies…" oninput="filterCompanies()">
      </div>
      <div class="flex-gap">
        <select class="form-select" id="co-status-filter" onchange="filterCompanies()" style="width:140px;padding:8px 12px">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="trial">Trial</option>
          <option value="suspended">Suspended</option>
          <option value="pending">Pending</option>
        </select>
        <button class="btn btn-primary" onclick="openAddCompany()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Company
        </button>
      </div>
    </div>
    <div class="card" style="padding:0">
      <table style="width:100%">
        <thead><tr>
          <th>Company</th><th>Plan</th><th>Status</th><th>Branches</th><th>Joined</th><th>Expires</th><th>Actions</th>
        </tr></thead>
        <tbody id="co-tbody"></tbody>
      </table>
    </div>
  `;
  renderCompaniesTable();
}

function renderCompaniesTable() {
  const q = (document.getElementById('co-search')?.value||'').toLowerCase();
  const sf = document.getElementById('co-status-filter')?.value||'';
  const tbody = document.getElementById('co-tbody');
  if (!tbody) return;
  let comps = Object.values(DATA.companies).filter(c =>
    (!q || c.name?.toLowerCase().includes(q) || c.email?.toLowerCase().includes(q)) &&
    (!sf || c.status === sf)
  );
  if (!comps.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text3)">No companies found</td></tr>`;
    return;
  }
  tbody.innerHTML = comps.map(c => {
    const plan = DATA.plans[c.planId] || {};
    const branchCount = Object.values(DATA.branches).filter(b => b.companyId === c.id).length;
    const joined = c.createdAt ? new Date(c.createdAt).toLocaleDateString() : '-';
    const expires = c.expiresAt ? new Date(c.expiresAt).toLocaleDateString() : '-';
    return `<tr>
      <td>
        <div style="font-weight:700;font-size:12px">${he(c.name)}</div>
        <div class="text-muted">${he(c.email||'')} · ${he(c.phone||'')}</div>
      </td>
      <td><span class="badge badge-pending" style="font-size:9px">${he(plan.name||c.planId||'—')}</span></td>
      <td>${statusBadge(c.status)}</td>
      <td class="td-mono">${branchCount} / ${plan.branches===-1?'∞':plan.branches||'?'}</td>
      <td class="td-mono" style="font-size:10px">${joined}</td>
      <td class="td-mono" style="font-size:10px;color:${isExpiringSoon(c.expiresAt)?'var(--danger)':'inherit'}">${expires}</td>
      <td>
        <div class="flex-gap">
          <button class="btn btn-sm" onclick="openEditCompany('${c.id}')">Edit</button>
          <button class="btn btn-sm" onclick="openCompanyModules('${c.id}')">Modules</button>
          <button class="btn btn-sm" style="color:${c.status==='active'?'var(--danger)':'var(--success)'}" onclick="toggleCompanyStatus('${c.id}')">
            ${c.status==='active'?'Suspend':'Activate'}
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function filterCompanies() { renderCompaniesTable(); }

function isExpiringSoon(ts) {
  if (!ts) return false;
  return (ts - Date.now()) < 7 * 24 * 60 * 60 * 1000;
}

function openAddCompany() {
  const plans = Object.values(DATA.plans);
  openModal(`
    <div class="modal-head">
      <div class="modal-title">Add New Company</div>
      <button class="modal-close" onclick="closeModal()">✕</button>

    <div class="form-row cols-2">
      <div class="form-group"><label class="form-label">Company Name *</label><input class="form-input" id="co-name" placeholder="ALFA.CO Restaurant Group"></div>
      <div class="form-group"><label class="form-label">Contact Email *</label><input class="form-input" id="co-email" type="email" placeholder="ceo@company.com"></div>
    </div>
    <div class="form-row cols-2">
      <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="co-phone" placeholder="+966 5x xxx xxxx"></div>
      <div class="form-group"><label class="form-label">Country</label><input class="form-input" id="co-country" value="Saudi Arabia"></div>
    </div>

    <div class="form-group" style="margin-bottom:20px">

      </div>

  `);

function saveCompany(id) {
  const name = document.getElementById('co-name').value.trim();
  const email = document.getElementById('co-email').value.trim();
  if (!name || !email) { toast('Name and email required', 'error'); return; }
  const expiry = document.getElementById('co-expiry').value;
  const rec = {
    id: id || 'co_' + Date.now(),
    name, email,
    phone: document.getElementById('co-phone').value.trim(),
    country: document.getElementById('co-country').value.trim(),
    planId: document.getElementById('co-plan').value,
    status: document.getElementById('co-status').value,
    startDate: document.getElementById('co-start').value,
    expiresAt: expiry ? new Date(expiry).getTime() : null,
    notes: document.getElementById('co-notes').value.trim(),
    updatedAt: Date.now(),
    createdAt: DATA.companies[id]?.createdAt || Date.now()
  };
  db.ref('admin/companies/' + rec.id).set(rec, err => {
    if (err) { toast('Save failed: ' + err.message, 'error'); return; }
    logAudit(id?'UPDATE_COMPANY':'ADD_COMPANY', `Company "${name}" ${id?'updated':'created'}`);
    toast(id ? 'Company updated' : 'Company created', 'success');
    closeModal();
  });
}

function toggleCompanyStatus(id) {
  const c = DATA.companies[id]; if (!c) return;
  const next = c.status === 'active' ? 'suspended' : 'active';
  if (!confirm(`${next === 'suspended' ? 'Suspend' : 'Activate'} ${c.name}?`)) return;
  db.ref('admin/companies/' + id + '/status').set(next, err => {
    if (err) { toast('Failed', 'error'); return; }
    logAudit('STATUS_CHANGE', `${c.name} → ${next}`);
    toast(`Company ${next}`, next === 'active' ? 'success' : 'warn');
  });
}

function deleteCompany(id) {
  const c = DATA.companies[id]; if (!c) return;
  if (!confirm(`Delete "${c.name}"? This cannot be undone.`)) return;
  db.ref('admin/companies/' + id).remove(err => {
    if (err) { toast('Delete failed', 'error'); return; }
    logAudit('DELETE_COMPANY', `Company "${c.name}" deleted`);
    toast('Company deleted', 'warn');
    closeModal();
  });
}

function openCompanyModules(companyId) {
  const c = DATA.companies[companyId]; if (!c) return;
  const plan = DATA.plans[c.planId] || {};
  const planMods = plan.modules || [];
  const overrides = c.moduleOverrides || {};
  const cats = [...new Set(ALL_MODULES.map(m => m.category))];

  openModal(`

function saveModulePermissions(companyId) {
  const c = DATA.companies[companyId]; if (!c) return;
  const plan = DATA.plans[c.planId] || {};
  const planMods = plan.modules || [];
  const overrides = {};
  ALL_MODULES.forEach(m => {
    const checked = document.getElementById('mod-' + m.id)?.checked;
    const inPlan = planMods.includes('all') || planMods.includes(m.id);
    if (checked !== inPlan) overrides[m.id] = !!checked; // only store differences
  });
  db.ref('admin/companies/' + companyId + '/moduleOverrides').set(overrides, err => {
    if (err) { toast('Save failed', 'error'); return; }
    logAudit('MODULE_PERM', `Updated module permissions for ${c.name}`);
    toast('Permissions saved', 'success');
    closeModal();
  });

function openPlanModal(id) {
  const p = id ? DATA.plans[id] : {};

  const cats = [...new Set(ALL_MODULES.map(m=>m.category))];
  openModal(`

      <div class="form-group"><label class="form-label">Max Users (-1=∞)</label><input class="form-input" id="pl-users" type="number" value="${p.users||5}"></div>
    </div>
    <div class="form-group mb-12"><label class="form-label">Description</label><input class="form-input" id="pl-desc" value="${he(p.desc||'')}"></div>
    <div style="margin-bottom:14px">
      <div class="form-label" style="margin-bottom:8px">Included Modules</div>
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:8px;border-radius:8px;background:var(--base-dk)">

      </label>

        <div style="margin-bottom:8px">
          <div class="text-muted" style="margin-bottom:4px">${cat}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${ALL_MODULES.filter(m=>m.category===cat).map(m=>`
              <label style="display:flex;align-items:center;gap:5px;font-size:11px;background:var(--base);box-shadow:var(--flat);padding:4px 8px;border-radius:6px;cursor:pointer">
                <input type="checkbox" class="plan-mod-cb" data-id="${m.id}" ${mods.includes(m.id)||mods.includes('all')?'checked':''} style="accent-color:var(--primary)">

            `).join('')}

  `);

function toggleAllModules(cb) {
  document.querySelectorAll('.plan-mod-cb').forEach(el => el.checked = cb.checked);
}

function savePlan(id) {
  const name = document.getElementById('pl-name').value.trim();
  if (!name) { toast('Name required', 'error'); return; }
  const allChecked = document.getElementById('pl-all').checked;
  const mods = allChecked ? ['all'] : [...document.querySelectorAll('.plan-mod-cb:checked')].map(el=>el.dataset.id);
  const rec = {
    id: id || 'plan_' + Date.now(),
    name,
    price: parseInt(document.getElementById('pl-price').value)||0,
    currency: 'SAR',
    branches: parseInt(document.getElementById('pl-branches').value)||1,
    users: parseInt(document.getElementById('pl-users').value)||5,
    desc: document.getElementById('pl-desc').value.trim(),
    modules: mods
  };
  db.ref('admin/plans/' + rec.id).set(rec, err => {
    if (err) { toast('Save failed', 'error'); return; }
    logAudit(id?'UPDATE_PLAN':'ADD_PLAN', `Plan "${name}" ${id?'updated':'created'}`);
    toast('Plan saved', 'success');
    closeModal();
  });
}

function deletePlan(id) {
  if (!confirm('Delete this plan?')) return;
  db.ref('admin/plans/' + id).remove(() => { toast('Plan deleted', 'warn'); });
}

function openUserModal(id) {
  const u = id ? DATA.users[id] : {};

  const roles = ['ceo','brand_dir','regional','branch_mgr','hr_manager','finance_dir'];
  openModal(`

    </div>
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label">Role *</label>
        <select class="form-select" id="u-role">

function saveUser(id) {
  const name = document.getElementById('u-name').value.trim();
  const pin = document.getElementById('u-pin').value.trim();
  const companyId = document.getElementById('u-company').value;
  if (!name || !pin) { toast('Name and PIN required', 'error'); return; }
  const branchRaw = document.getElementById('u-branches').value.trim();
  const branchIds = branchRaw ? branchRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
  const rec = {
    id: id || 'usr_' + Date.now(),
    name, pin,
    email: document.getElementById('u-email').value.trim(),
    role: document.getElementById('u-role').value,
    companyId, branchIds
  };
  db.ref('admin/users/' + rec.id).set(rec, err => {
    if (err) { toast('Save failed', 'error'); return; }
    logAudit(id?'UPDATE_USER':'ADD_USER', `User "${name}" ${id?'updated':'added'}`);
    toast('User saved', 'success');
    closeModal();
  });
}

function deleteUser(id) {
  const u = DATA.users[id]; if (!u) return;
  if (!confirm(`Remove ${u.name}?`)) return;
  db.ref('admin/users/' + id).remove(() => { toast('User removed', 'warn'); });
}

function saveBranch(id) {
  const branchId = id || document.getElementById('br-id').value.trim().replace(/\s+/g,'_').toLowerCase();

  const pin = document.getElementById('br-pin').value.trim();

    id: branchId, name, pin,
    companyId: document.getElementById('br-company').value,
    brand: document.getElementById('br-brand').value.trim(),
    location: document.getElementById('br-loc').value.trim(),
    manager: document.getElementById('br-mgr').value.trim(),
    icon: document.getElementById('br-icon').value.trim() || '🍽️'
  };
  db.ref('admin/branches/' + branchId).set(rec, err => {
    if (err) { toast('Save failed', 'error'); return; }
    logAudit(id?'UPDATE_BRANCH':'ADD_BRANCH', `Branch "${name}" ${id?'updated':'added'}`);
    toast('Branch saved', 'success');
    closeModal();
  });
}

function deleteBranch(id) {
  const b = DATA.branches[id]; if (!b) return;
  if (!confirm(`Remove branch "${b.name}"? Branch DATA in Firebase is NOT deleted.`)) return;
  db.ref('admin/branches/' + id).remove(() => { toast('Branch removed from registry', 'warn'); });

/* ═══════════════════════════════════════════════════

═══════════════════════════════════════════════════ */
function renderAnalytics() {
  const el = document.getElementById('content');
  const companies = Object.values(DATA.companies);
  const byPlan = {};
  const byStatus = { active:0, trial:0, suspended:0, pending:0 };
  companies.forEach(c => {
    byPlan[c.planId] = (byPlan[c.planId]||0) + 1;
    if (c.status) byStatus[c.status] = (byStatus[c.status]||0) + 1;
  });
  const totalMRR = companies.filter(c=>c.status==='active').reduce((sum,c)=>{
    return sum + (DATA.plans[c.planId]?.price||0);
  },0);

  el.innerHTML = `
    <div class="grid-2 mb-16">
      <div class="card">
        <div class="card-title"><div class="card-title-accent"></div>Companies by Status</div>
        ${Object.entries(byStatus).map(([s,n])=>`
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
            <div style="width:70px;font-size:11px;font-family:var(--mono);text-transform:capitalize">${s}</div>
            <div class="metric-bar" style="flex:1"><div class="metric-fill" style="width:${companies.length?Math.round(n/companies.length*100):0}%;background:${s==='active'?'var(--success)':s==='trial'?'var(--warning)':s==='suspended'?'var(--danger)':'var(--info)'}"></div></div>
            <div style="font-size:11px;font-weight:700;width:20px;text-align:right">${n}</div>
          </div>
        `).join('')}
      </div>
      <div class="card">
        <div class="card-title"><div class="card-title-accent"></div>Companies by Plan</div>
        ${Object.entries(byPlan).map(([pid,n])=>`
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
            <div style="width:100px;font-size:11px;font-family:var(--mono)">${DATA.plans[pid]?.name||pid}</div>
            <div class="metric-bar" style="flex:1"><div class="metric-fill" style="width:${companies.length?Math.round(n/companies.length*100):0}%"></div></div>
            <div style="font-size:11px;font-weight:700;width:20px;text-align:right">${n}</div>
          </div>
        `).join('')}
        ${!Object.keys(byPlan).length?'<div class="text-muted text-center">No data</div>':''}
      </div>
    </div>
    <div class="card">
      <div class="card-title"><div class="card-title-accent"></div>Revenue Summary</div>
      <div class="grid-3">
        <div style="text-align:center;padding:16px">
          <div class="kpi-label">Monthly Recurring Revenue</div>
          <div style="font-size:28px;font-weight:700;color:var(--primary);font-family:var(--mono)">${totalMRR.toLocaleString()}</div>
          <div class="text-muted">SAR / month</div>
        </div>
        <div style="text-align:center;padding:16px">
          <div class="kpi-label">Annual Run Rate</div>
          <div style="font-size:28px;font-weight:700;color:var(--accent);font-family:var(--mono)">${(totalMRR*12).toLocaleString()}</div>
          <div class="text-muted">SAR / year (projected)</div>
        </div>
        <div style="text-align:center;padding:16px">
          <div class="kpi-label">Avg Revenue / Company</div>
          <div style="font-size:28px;font-weight:700;color:#065F46;font-family:var(--mono)">${byStatus.active?Math.round(totalMRR/byStatus.active).toLocaleString():0}</div>
          <div class="text-muted">SAR / active company</div>
        </div>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════ */
function he(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function statusBadge(status) {
  const map = {
    active: 'badge-active', trial: 'badge-trial',
    suspended: 'badge-suspended', pending: 'badge-pending'
  };
  return `<span class="badge ${map[status]||''}"><span class="badge-dot"></span>${status||'unknown'}</span>`;
}

function openModal(html) {
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

function toast(msg, type = 'success') {
  const stack = document.getElementById('toast-stack');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success:'✓', error:'✕', warn:'⚠' };
  el.innerHTML = `<span>${icons[type]||'•'}</span><span>${msg}</span>`;
  stack.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
</script>
