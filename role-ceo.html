<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpsHub — Executive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="core.js"></script>
</head>
<body>
<div id="app"></div>
<script>
injectCSS();

var ALLOWED = ['super_admin','ceo','brand_dir','regional'];
var sess = requireSession(ALLOWED);
if (!sess) throw new Error('No session');

/* ── NAV ── */
var NAV_CEO = [
  { section:'OVERVIEW', items:[
    { id:'exec-dash',     label:'Executive Dashboard',
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>' },
    { id:'rev-analytics', label:'Revenue Analytics',
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>' },
    { id:'food-cost',     label:'Food Cost',
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>' },
    { id:'headcount',     label:'Headcount',
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>' },
    { id:'alerts-center', label:'Alerts',
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>' }
  ]},
  { section:'BRANCHES', items:[
    { id:'brand-branches', label:'All Branches',
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>' }
  ]},
  { section:'ADMIN', items:[
    { id:'access-ctrl',  label:'Access Control',
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/><circle cx="12" cy="16" r="1"/></svg>' },
    { id:'brand-mgmt',   label:'Brand Management',
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>' }
  ]}
];

/* ── State ── */
var NX_BRANCHES_ALL = {};
var ALL_SALES  = [];
var ALL_STAFF  = [];
var ALL_WASTE  = [];
var ALL_PC     = [];
var _loadedBranches = false;

/* ── Load all branches data ── */
function loadAllBranches(cb) {
  if (_loadedBranches) { if(cb)cb(); return; }
  if(!db){setTimeout(function(){loadAllBranches(cb);},500);return;}

  db.ref('admin/branches').once('value', function(s) {
    NX_BRANCHES_ALL = {};
    Object.values(s.val()||{}).filter(Boolean).forEach(function(b){ if(b.id) NX_BRANCHES_ALL[b.id]=b; });

    var branches = Object.keys(NX_BRANCHES_ALL);
    if(!branches.length){ _loadedBranches=true; if(cb)cb(); return; }

    var done=0, total=branches.length*4;
    function tick(){if(++done===total){_loadedBranches=true;if(cb)cb();}}

    branches.forEach(function(bid){
      db.ref('branches/'+bid+'/sales').once('value',function(s){
        Object.values(s.val()||{}).filter(Boolean).forEach(function(x){x._branchId=bid;ALL_SALES.push(x);}); tick();
      });
      db.ref('branches/'+bid+'/staff').once('value',function(s){
        Object.values(s.val()||{}).filter(Boolean).forEach(function(x){x._branchId=bid;ALL_STAFF.push(x);}); tick();
      });
      db.ref('branches/'+bid+'/waste').once('value',function(s){
        Object.values(s.val()||{}).filter(Boolean).forEach(function(x){x._branchId=bid;ALL_WASTE.push(x);}); tick();
      });
      db.ref('branches/'+bid+'/pc').once('value',function(s){
        Object.values(s.val()||{}).filter(Boolean).forEach(function(x){x._branchId=bid;ALL_PC.push(x);}); tick();
      });
    });
  });
}

/* ── Pages ── */
var PAGES = {};

PAGES['exec-dash'] = function(){
  var totalSales = ALL_SALES.reduce(function(s,x){return s+(parseFloat(x.netSales||x.total||0));},0);
  var totalStaff = ALL_STAFF.length;
  var totalWaste = ALL_WASTE.reduce(function(s,w){return s+(parseFloat(w.cost||0));},0);
  var branches   = Object.keys(NX_BRANCHES_ALL).length;

  return '<div class="page-header"><div><div class="page-title">Executive Dashboard</div>'+
    '<div class="page-title-sub">ALFA.CO — All Brands</div></div></div>'+

    '<div class="kpi-grid">'+
    k('Branches', branches, 'active locations')+
    k('Total Sales', fmtSAR(totalSales), 'all branches')+
    k('Total Staff', totalStaff, 'headcount')+
    k('Total Wastage', fmtSAR(totalWaste), 'cost logged')+
    '</div>'+

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'+
    branchSalesTable()+
    topWasteBranch()+
    '</div>';
};

function k(l,v,s){
  return '<div class="kpi"><div class="kpi-label">'+l+'</div><div class="kpi-value">'+v+'</div>'+(s?'<div class="kpi-sub">'+s+'</div>':'')+
    '</div>';
}

function branchSalesTable(){
  var byBranch={};
  ALL_SALES.forEach(function(s){
    var bid=s._branchId;
    if(!byBranch[bid])byBranch[bid]={name:(NX_BRANCHES_ALL[bid]||{}).name||bid,total:0};
    byBranch[bid].total+=(parseFloat(s.netSales||s.total||0));
  });
  var rows=Object.values(byBranch).sort(function(a,b){return b.total-a.total;});
  return '<div class="card"><div class="card-title">Sales by Branch</div>'+
    '<div class="tbl-wrap"><table><thead><tr><th>Branch</th><th>Total Sales</th></tr></thead><tbody>'+
    (rows.length?rows.map(function(r){
      return '<tr><td>'+xe(r.name)+'</td><td style="color:var(--success);font-weight:700">'+fmtSAR(r.total)+'</td></tr>';
    }).join(''):'<tr><td colspan="2" style="text-align:center;padding:20px;color:var(--text-3)">No data</td></tr>')+
    '</tbody></table></div></div>';
}

function topWasteBranch(){
  var byBranch={};
  ALL_WASTE.forEach(function(w){
    var bid=w._branchId;
    if(!byBranch[bid])byBranch[bid]={name:(NX_BRANCHES_ALL[bid]||{}).name||bid,total:0};
    byBranch[bid].total+=(parseFloat(w.cost||0));
  });
  var rows=Object.values(byBranch).sort(function(a,b){return b.total-a.total;});
  return '<div class="card"><div class="card-title">Wastage by Branch</div>'+
    '<div class="tbl-wrap"><table><thead><tr><th>Branch</th><th>Waste Cost</th></tr></thead><tbody>'+
    (rows.length?rows.map(function(r){
      return '<tr><td>'+xe(r.name)+'</td><td style="color:var(--danger);font-weight:700">'+fmtSAR(r.total)+'</td></tr>';
    }).join(''):'<tr><td colspan="2" style="text-align:center;padding:20px;color:var(--text-3)">No data</td></tr>')+
    '</tbody></table></div></div>';
}

PAGES['brand-branches'] = function(){
  var branches = Object.values(NX_BRANCHES_ALL);
  return '<div class="page-header"><div class="page-title">All Branches</div></div>'+
    '<div class="kpi-grid">'+k('Total Branches',branches.length,'')+
    k('Brands',[...new Set(branches.map(function(b){return b.brand||'ALFA';}))].length,'distinct brands')+
    '</div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">'+
    branches.map(function(b){
      var bSales=ALL_SALES.filter(function(s){return s._branchId===b.id;}).reduce(function(t,s){return t+(parseFloat(s.netSales||s.total||0));},0);
      var bStaff=ALL_STAFF.filter(function(s){return s._branchId===b.id;}).length;
      return '<div class="kpi" style="cursor:pointer;border:2px solid transparent;transition:border .12s" onmouseover="this.style.borderColor=\'var(--primary)\'" onmouseout="this.style.borderColor=\'transparent\'">'+
        '<div class="kpi-label">'+xe(b.brand||'ALFA')+'</div>'+
        '<div class="kpi-value" style="font-size:14px">'+xe(b.name||b.id)+'</div>'+
        '<div class="kpi-sub">'+fmtSAR(bSales)+' sales · '+bStaff+' staff</div>'+
        (b.location?'<div class="kpi-sub">'+xe(b.location)+'</div>':'')+
        '</div>';
    }).join('')+
    '</div>';
};

PAGES['rev-analytics'] = function(){
  return '<div class="page-header"><div class="page-title">Revenue Analytics</div></div>'+
    '<div class="card" style="text-align:center;padding:40px;color:var(--text-3)">Revenue analytics charts — coming soon.</div>';
};

PAGES['food-cost'] = function(){
  var totalSales = ALL_SALES.reduce(function(s,x){return s+(parseFloat(x.netSales||x.total||0));},0);
  var totalWaste = ALL_WASTE.reduce(function(s,w){return s+(parseFloat(w.cost||0));},0);
  var pct = totalSales>0?((totalWaste/totalSales)*100).toFixed(1):0;
  return '<div class="page-header"><div class="page-title">Food Cost & Wastage</div></div>'+
    '<div class="kpi-grid">'+
    k('Total Waste', fmtSAR(totalWaste), 'all branches')+
    k('Total Sales', fmtSAR(totalSales), 'all branches')+
    k('Waste %', pct+'%', 'of net sales')+
    '</div>'+
    '<div class="card"><div class="card-title">Waste by Branch</div>'+branchWasteTable()+'</div>';
};

function branchWasteTable(){
  var byBranch={};
  ALL_WASTE.forEach(function(w){
    var bid=w._branchId;
    if(!byBranch[bid])byBranch[bid]={name:(NX_BRANCHES_ALL[bid]||{}).name||bid,cost:0,count:0};
    byBranch[bid].cost+=(parseFloat(w.cost||0));
    byBranch[bid].count++;
  });
  var rows=Object.values(byBranch).sort(function(a,b){return b.cost-a.cost;});
  return '<div class="tbl-wrap"><table><thead><tr><th>Branch</th><th>Waste Cost</th><th>Entries</th></tr></thead><tbody>'+
    (rows.length?rows.map(function(r){
      return '<tr><td>'+xe(r.name)+'</td><td style="color:var(--danger);font-weight:700">'+fmtSAR(r.cost)+'</td><td>'+r.count+'</td></tr>';
    }).join(''):'<tr><td colspan="3" style="text-align:center;padding:20px;color:var(--text-3)">No data</td></tr>')+
    '</tbody></table></div>';
}

PAGES['headcount'] = function(){
  var byBranch={};
  ALL_STAFF.forEach(function(s){
    var bid=s._branchId;
    if(!byBranch[bid])byBranch[bid]={name:(NX_BRANCHES_ALL[bid]||{}).name||bid,count:0,active:0};
    byBranch[bid].count++;
    if(s.status==='Active'||!s.status) byBranch[bid].active++;
  });
  return '<div class="page-header"><div class="page-title">Headcount</div></div>'+
    '<div class="kpi-grid">'+k('Total Staff',ALL_STAFF.length,'')+k('Branches',Object.keys(byBranch).length,'with staff data')+
    '</div>'+
    '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Branch</th><th>Total</th><th>Active</th></tr></thead><tbody>'+
    Object.values(byBranch).map(function(b){
      return '<tr><td>'+xe(b.name)+'</td><td style="font-weight:700">'+b.count+'</td><td style="color:var(--success)">'+b.active+'</td></tr>';
    }).join('')+
    '</tbody></table></div></div>';
};

PAGES['alerts-center'] = function(){
  return '<div class="page-header"><div class="page-title">Alerts Center</div></div>'+
    '<div class="card"><div style="text-align:center;padding:40px;color:var(--text-3)">Real-time alerts and compliance monitoring.</div></div>';
};

PAGES['access-ctrl'] = function(){
  return '<div class="page-header"><div class="page-title">Access Control</div></div>'+
    '<div class="card"><div style="text-align:center;padding:40px;color:var(--text-3)">User management and PIN management.</div></div>';
};

PAGES['brand-mgmt'] = function(){
  return '<div class="page-header"><div class="page-title">Brand Management</div></div>'+
    '<div class="card"><div style="text-align:center;padding:40px;color:var(--text-3)">Brand and branch configuration.</div></div>';
};

/* ── Navigation ── */
function navTo(pageId) {
  NX.page = pageId;
  setActiveSiItem(pageId);
  var pa = document.getElementById('page-area');
  if (!pa) return;
  pa.innerHTML = '<div style="text-align:center;padding:60px"><div class="spin" style="margin:0 auto 14px"></div></div>';

  function render(){
    var fn=PAGES[pageId];
    pa.innerHTML = fn ? fn() : '<div class="empty">Page "'+pageId+'" coming soon.</div>';
  }

  if (!_loadedBranches) { loadAllBranches(render); } else { render(); }
}

window.onload = function(){
  loadAllBranches(function(){ renderShell(NAV_CEO,'exec-dash'); });
};
</script>
</body>
</html>
