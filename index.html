<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpsHub</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --base:#E7E5E4;--base-dk:#D4D2D1;--base-lt:#F5F3F2;
  --sd:rgba(0,0,0,.18);--sl:rgba(255,255,255,.88);
  --raise:6px 6px 16px var(--sd),-6px -6px 16px var(--sl);
  --raise-sm:3px 3px 8px var(--sd),-3px -3px 8px var(--sl);
  --raise-lg:10px 10px 28px var(--sd),-10px -10px 28px var(--sl);
  --inset:inset 4px 4px 10px rgba(0,0,0,.12),inset -4px -4px 10px rgba(255,255,255,.72);
  --inset-sm:inset 2px 2px 6px rgba(0,0,0,.10),inset -2px -2px 6px rgba(255,255,255,.65);
  --flat:2px 2px 5px var(--sd),-2px -2px 5px var(--sl);
  --primary:#006666;--primary-h:#008080;--primary-pale:rgba(0,102,102,.1);
  --success:#00A63D;--danger:#FF2157;--warning:#FE9900;--info:#0075CC;
  --text:#1E2938;--text2:rgba(30,41,56,.58);--text3:rgba(30,41,56,.35);
  --font:'Space Mono','Courier New',monospace;
  --sidebar:216px;--hdr:52px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;font-family:var(--font);color:var(--text);background:var(--base);font-size:13px}
button,input,select,textarea{font-family:var(--font);outline:none}
button{cursor:pointer;border:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--base-dk);border-radius:4px}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:999;background:var(--base);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#splash.gone{display:none}
.sp-icon{width:68px;height:68px;border-radius:18px;background:var(--primary);box-shadow:var(--raise-lg);display:flex;align-items:center;justify-content:center}
.sp-bar{width:48px;height:3px;border-radius:2px;background:var(--base-dk);overflow:hidden;position:relative}
.sp-bar::after{content:'';position:absolute;left:-100%;width:55%;height:100%;background:var(--primary);border-radius:2px;animation:sld 1s linear infinite}
@keyframes sld{to{left:160%}}

/* LOGIN */
#login{position:fixed;inset:0;z-index:500;background:var(--base);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#login.gone{display:none}
.lw{width:100%;max-width:400px}
.l-logo{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.l-logo-icon{width:46px;height:46px;background:var(--primary);border-radius:13px;box-shadow:var(--raise-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.l-title{font-size:18px;font-weight:700;color:var(--primary)}
.l-sub{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.l-card{background:var(--base);border-radius:18px;box-shadow:var(--raise-lg);padding:26px}
.l-step-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:18px}
.branch-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto}
.branch-btn{background:var(--base);border-radius:10px;box-shadow:var(--raise-sm);padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;transition:all .15s}
.branch-btn:hover{box-shadow:var(--raise);transform:translateY(-1px)}
.branch-btn:active{box-shadow:var(--inset-sm);transform:none}
.b-icon{width:30px;height:30px;border-radius:8px;background:var(--primary-pale);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.b-name{font-size:12px;font-weight:700;color:var(--text)}
.b-loc{font-size:10px;color:var(--text3);margin-top:1px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-card{background:var(--base);border-radius:12px;box-shadow:var(--raise-sm);padding:13px 12px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:all .15s}
.role-card:hover{box-shadow:var(--raise);transform:translateY(-1px)}
.role-card:active{box-shadow:var(--inset-sm);transform:none}
.role-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.role-label strong{display:block;font-size:11px;font-weight:700}
.role-label span{font-size:10px;color:var(--text3)}
.pin-dots{display:flex;gap:10px;justify-content:center;margin-bottom:22px}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--base-dk);box-shadow:var(--inset-sm);transition:background .15s}
.pin-dot.on{background:var(--primary)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-key{background:var(--base);border-radius:12px;box-shadow:var(--raise-sm);height:52px;font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.pin-key:hover{box-shadow:var(--raise)}
.pin-key:active{box-shadow:var(--inset-sm)}
.pk-zero{grid-column:2}
.pk-del{grid-column:3;color:var(--text2)}
.l-back{font-size:11px;color:var(--text3);cursor:pointer;text-align:center;margin-top:12px;padding:5px}
.l-back:hover{color:var(--primary)}
.l-err{font-size:11px;color:var(--danger);text-align:center;min-height:18px;margin-top:-6px;margin-bottom:8px}

/* APP SHELL */
#app{display:none;min-height:100vh}
#app.show{display:flex}
#sidebar{width:var(--sidebar);flex-shrink:0;background:var(--base-dk);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;overflow-y:auto;padding-bottom:12px}
#main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-height:100vh}

/* SIDEBAR */
.sb-logo{padding:16px 14px 12px;border-bottom:1px solid rgba(0,0,0,.07)}
.sb-logo-row{display:flex;align-items:center;gap:10px}
.sb-mark{width:32px;height:32px;background:var(--primary);border-radius:9px;box-shadow:var(--raise-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-name{font-size:13px;font-weight:700;color:var(--primary)}
.sb-ver{font-size:9px;color:var(--text3);margin-top:1px}
.sb-branch{padding:10px 14px 6px;border-bottom:1px solid rgba(0,0,0,.07)}
.sb-bname{font-size:11px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-role{font-size:10px;color:var(--text3)}
.sb-sec{padding:11px 12px 3px;font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:1px 8px;border-radius:9px;cursor:pointer;color:var(--text2);font-size:11px;font-weight:700;transition:all .15s;user-select:none}
.nav-item:hover{color:var(--text);background:rgba(0,0,0,.04)}
.nav-item.active{background:var(--base);box-shadow:var(--raise-sm);color:var(--primary)}
.nav-ic{width:14px;height:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:inherit}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;min-width:14px;text-align:center}
.sb-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid rgba(0,0,0,.07)}

/* HEADER */
#header{height:var(--hdr);background:var(--base);border-bottom:1px solid rgba(0,0,0,.07);display:flex;align-items:center;padding:0 18px;gap:12px;position:sticky;top:0;z-index:90;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.hdr-title{font-size:13px;font-weight:700;color:var(--text);flex:1}
.hdr-btn{width:32px;height:32px;border-radius:9px;background:var(--base);box-shadow:var(--raise-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2)}
.hdr-btn:hover{color:var(--primary)}
.hdr-btn:active{box-shadow:var(--inset-sm)}
.hdr-user{display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:9px;background:var(--base);box-shadow:var(--raise-sm);cursor:pointer}
.hdr-av{width:26px;height:26px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.hdr-uname{font-size:11px;font-weight:700;color:var(--text)}
.hdr-urole{font-size:9px;color:var(--text3)}

/* CONTENT */
#content{flex:1;padding:16px 18px;overflow-y:auto}

/* CARDS */
.card{background:var(--base);border-radius:13px;box-shadow:var(--raise);padding:14px}
.card-title{font-size:11px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.card-acc{width:3px;height:13px;border-radius:2px;background:var(--primary);flex-shrink:0}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi-card{background:var(--base);border-radius:13px;box-shadow:var(--raise);padding:12px 14px;border-left:3px solid var(--primary);position:relative;overflow:hidden;transition:transform .15s}
.kpi-card:nth-child(2){border-left-color:#D97706}
.kpi-card:nth-child(3){border-left-color:#5B21B6}
.kpi-card:nth-child(4){border-left-color:#065F46}
.kpi-card:nth-child(5){border-left-color:#9F1239}
.kpi-card:nth-child(6){border-left-color:#0369A1}
.kpi-card:hover{transform:translateY(-2px)}
.kpi-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.kpi-val{font-size:22px;font-weight:700;color:var(--text);line-height:1;letter-spacing:-.5px}
.kpi-sub{font-size:10px;color:var(--text2);margin-top:3px}
.kpi-ico{position:absolute;right:10px;top:50%;transform:translateY(-50%);opacity:.08;color:var(--text)}

/* TABLES */
.tbl{border-radius:11px;box-shadow:var(--inset-sm);overflow:hidden;background:var(--base-lt)}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--base-dk)}
th{padding:8px 11px;text-align:left;font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
td{padding:9px 11px;font-size:11px;color:var(--text);border-bottom:1px solid rgba(0,0,0,.04)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(0,0,0,.015)}
.td-r{text-align:right}
.td-mono{font-family:var(--font);font-size:11px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:9px;font-size:11px;font-weight:700;background:var(--base);box-shadow:var(--raise-sm);color:var(--text);cursor:pointer;transition:all .15s;font-family:var(--font)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--raise)}
.btn:active{box-shadow:var(--inset-sm);transform:none}
.btn-primary{background:var(--primary);color:#fff;box-shadow:3px 3px 10px rgba(0,102,102,.3),-2px -2px 8px rgba(255,255,255,.5)}
.btn-primary:hover{background:var(--primary-h)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:5px 10px;font-size:10px;border-radius:7px}
.btn-xs{padding:3px 7px;font-size:10px;border-radius:6px}

/* FORMS */
.fg{display:flex;flex-direction:column;gap:3px;margin-bottom:11px}
.fl{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.fi,.fs,.fta{background:var(--base);box-shadow:var(--inset-sm);border-radius:8px;padding:7px 10px;font-size:11px;color:var(--text);font-family:var(--font);width:100%}
.fi:focus,.fs:focus,.fta:focus{box-shadow:var(--inset),0 0 0 2px var(--primary-pale)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.2px}
.bg{background:rgba(0,166,61,.12);color:#065F46}
.br{background:rgba(255,33,87,.12);color:#9F1239}
.ba{background:rgba(254,153,0,.14);color:#92400E}
.bb{background:rgba(0,117,204,.12);color:#1D4ED8}
.bp{background:rgba(91,33,182,.12);color:#5B21B6}
.bk{background:rgba(0,0,0,.07);color:var(--text2)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(30,41,56,.32);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-bg.gone{display:none}
.modal-box{background:var(--base);border-radius:16px;box-shadow:var(--raise-lg);width:100%;max-width:500px;max-height:88vh;overflow-y:auto;padding:20px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:12px;font-weight:700;color:var(--text)}
.modal-x{width:24px;height:24px;border-radius:6px;background:var(--base);box-shadow:var(--raise-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:12px}
.modal-x:active{box-shadow:var(--inset-sm)}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--base-dk);border-radius:9px;padding:3px;margin-bottom:12px}
.tab{flex:1;padding:5px 8px;border-radius:6px;font-size:10px;font-weight:700;color:var(--text2);cursor:pointer;text-align:center;transition:all .15s;font-family:var(--font)}
.tab.on{background:var(--base);box-shadow:var(--raise-sm);color:var(--primary)}

/* TOASTS */
#toasts{position:fixed;bottom:14px;right:14px;z-index:999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{background:var(--base);border-radius:11px;box-shadow:var(--raise);padding:10px 13px;font-size:11px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;border-left:3px solid var(--primary);animation:tin .2s ease;pointer-events:auto}
.toast.s{border-left-color:var(--success)}
.toast.e{border-left-color:var(--danger)}
.toast.w{border-left-color:var(--warning)}
@keyframes tin{from{transform:translateX(50px);opacity:0}to{transform:none;opacity:1}}

/* MISC */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.flex{display:flex;align-items:center}
.flex-g{display:flex;align-items:center;gap:8px}
.flex-b{display:flex;align-items:center;justify-content:space-between}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-title{font-size:12px;font-weight:700;color:var(--text)}
.muted{color:var(--text3);font-size:10px}
.fw7{font-weight:700}
.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mt-10{margin-top:10px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:12px;color:var(--text3)}
.empty-txt{font-size:11px}
.mbar-w{background:var(--base-dk);border-radius:3px;height:5px;overflow:hidden}
.mbar-f{height:100%;border-radius:3px;background:var(--primary);transition:width .4s}
.cl-item{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:8px;background:var(--base);box-shadow:var(--flat);margin-bottom:5px;transition:all .15s}
.cl-item.done{box-shadow:var(--inset-sm);opacity:.6}
.cl-cb{width:18px;height:18px;border-radius:5px;background:var(--base);box-shadow:var(--inset-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;color:var(--success);font-size:10px}
.cl-lbl{font-size:11px;color:var(--text);flex:1}
.cl-item.done .cl-lbl{text-decoration:line-through;color:var(--text3)}
.qa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;margin-bottom:16px}
.qa-card{background:var(--base);border-radius:11px;box-shadow:var(--raise-sm);padding:12px 10px;cursor:pointer;transition:all .15s;text-align:center}
.qa-card:hover{transform:translateY(-2px);box-shadow:var(--raise)}
.qa-card:active{box-shadow:var(--inset-sm);transform:none}
.qa-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin:0 auto 7px}
.qa-lbl{font-size:10px;font-weight:700;color:var(--text)}

@media(max-width:860px){
  #sidebar{transform:translateX(-100%);transition:transform .25s}
  #sidebar.open{transform:none}
  #main{margin-left:0}
  .g2,.g3{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:1fr 1fr}
}
</style>

</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="sp-icon">
    <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/>
      <rect x="3" y="14" width="7" height="7" rx="1.2"/><path d="M14 14h7M14 17.5h7M14 21h7"/>
    </svg>
  </div>
  <div style="font-size:19px;font-weight:700;color:var(--primary)">OpsHub</div>
  <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px">Operations Platform</div>
  <div class="sp-bar"></div>
</div>

<!-- LOGIN -->
<div id="login">
  <div class="lw">
    <div class="l-logo">
      <div class="l-logo-icon">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/>
          <rect x="3" y="14" width="7" height="7" rx="1.2"/><path d="M14 14h7M14 17.5h7M14 21h7"/>
        </svg>
      </div>
      <div><div class="l-title">OpsHub</div><div class="l-sub">Restaurant Ops</div></div>
    </div>
    <div class="l-card" id="l-card"><div class="l-step-title">Loading...</div></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <nav id="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-row">
        <div class="sb-mark">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/>
            <rect x="3" y="14" width="7" height="7" rx="1.2"/><path d="M14 14h7M14 17.5h7M14 21h7"/>
          </svg>
        </div>
        <div><div class="sb-name">OpsHub</div><div class="sb-ver">v2.0</div></div>
      </div>
    </div>
    <div class="sb-branch">
      <div class="sb-bname" id="sb-bname">—</div>
      <div class="sb-role" id="sb-role">—</div>
    </div>
    <div id="sb-nav"></div>
    <div class="sb-foot">
      <div class="nav-item" onclick="doLogout()">
        <div class="nav-ic"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
        Sign Out
      </div>
    </div>
  </nav>
  <div id="main">
    <div id="header">
      <div class="hdr-title" id="hdr-title">Dashboard</div>
      <div class="flex-g">
        <button class="hdr-btn" onclick="navTo('alerts-center')">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <div class="hdr-user">
          <div class="hdr-av" id="hdr-av">—</div>
          <div><div class="hdr-uname" id="hdr-uname">—</div><div class="hdr-urole" id="hdr-urole">—</div></div>
        </div>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="modal-bg gone" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modal-box"></div>
</div>
<div id="toasts"></div>

<script>

function he(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n,d){return(parseFloat(n)||0).toLocaleString('en',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function toast(msg,t){
  var ts=document.getElementById('toasts');var el=document.createElement('div');
  el.className='toast '+(t||'');
  el.innerHTML='<span>'+(t==='s'?'✓':t==='e'?'✕':'·')+'</span><span>'+he(msg)+'</span>';
  ts.appendChild(el);setTimeout(function(){el.remove();},3200);
}

window.onload=function(){
  var s=sessionStorage.getItem('nx_session');
  if(s){try{NX.session=JSON.parse(s);bootApp();}catch(e){bootLogin();}}
  else bootLogin();
};
function bootLogin(){
  setTimeout(function(){document.getElementById('splash').classList.add('gone');},900);
  loadBranches(renderStep0);
}
function bootApp(){
  document.getElementById('splash').classList.add('gone');
  document.getElementById('login').classList.add('gone');
  document.getElementById('app').classList.add('show');
  renderSidebar();updateHeader();loadAlerts();loadPrayers();navTo(defaultPage());
}
function loadBranches(cb){
  db.ref('admin/branches').once('value',function(s){
    NX.branches={};
    Object.values(s.val()||{}).filter(Boolean).forEach(function(b){if(b.id)NX.branches[b.id]=b;});
    if(cb)cb();
  });
}

function lRole(role){
  _ls.role=role;_ls.pin='';
  if(FREE_ROLES.indexOf(role)>=0){
    _ls.branchId='hq';_ls.branchName='HQ';_ls.companyId='alfaco';
    lShowPIN();
  } else {
    lShowBranches();
  }
}

function lShowBranches(){
  var branches=Object.values(NX.branches);
  var card=document.getElementById('l-card');
  var role=ROLES.find(function(r){return r.id===_ls.role;})||{};
  card.innerHTML='<div class="l-step-title" style="color:'+he(role.c||'var(--primary)')+'">'+he(role.l||'')+'</div>'+
    '<div style="font-size:10px;color:var(--text3);margin-bottom:12px">Select your branch</div>'+
    (branches.length?
      '<div class="branch-list">'+
      branches.map(function(b){
        return '<button class="branch-btn" onclick="lBranch(''+b.id+'',''+he(b.name)+'',''+he(b.companyId||'alfaco')+'')">'+
          '<div class="b-icon">'+(b.icon||'🍽️')+'</div>'+
          '<div><div class="b-name">'+he(b.name)+'</div><div class="b-loc">'+he(b.brand||b.location||b.id)+'</div></div>'+
        '</button>';
      }).join('')+
      '</div>'
    :'<div style="text-align:center;padding:20px;color:var(--text3);font-size:11px">No branches found. Contact your administrator.</div>')+
    '<div class="l-back" onclick="renderStep0()">← Back to roles</div>';
}

function lBranch(id,name,co){_ls.branchId=id;_ls.branchName=name;_ls.companyId=co;lShowPIN();}

function lShowPIN(){
  document.getElementById('l-card').innerHTML=
    '<div class="l-step-title">Enter your PIN</div>'+
    '<div class="l-err" id="perr"></div>'+
    '<div class="pin-dots"><div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div><div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div></div>'+
    '<div class="pin-pad">'+
    [1,2,3,4,5,6,7,8,9].map(function(n){return '<div class="pin-key" onclick="pKey('+n+')">'+n+'</div>';}).join('')+
    '<div class="pin-key pk-zero" onclick="pKey(0)">0</div>'+
    '<div class="pin-key pk-del" onclick="pDel()">⌫</div>'+
    '</div>'+
    '<div class="l-back" onclick="lShowRoles()">← Back to roles</div>';
}

function pKey(n){
  if(_ls.pin.length>=4)return;
  _ls.pin+=String(n);pDots();
  if(_ls.pin.length===4)setTimeout(checkPIN,200);
}
function pDel(){_ls.pin=_ls.pin.slice(0,-1);pDots();}
function pDots(){for(var i=0;i<4;i++){var e=document.getElementById('pd'+i);if(e)e.classList.toggle('on',i<_ls.pin.length);}}
function pErr(msg){var e=document.getElementById('perr');if(e)e.textContent=msg;_ls.pin='';pDots();setTimeout(function(){if(e)e.textContent='';},2200);}

function checkPIN(){
  var freeRoles=['super_admin','ceo','hr_manager','finance_dir'];
  db.ref('admin/users').orderByChild('role').equalTo(_ls.role).once('value',function(snap){
    var found=null;
    snap.forEach(function(c){
      var u=c.val();
      if(!u||u.pin!==_ls.pin)return;
      var branchOk=freeRoles.indexOf(_ls.role)>=0||!u.branchIds||!u.branchIds.length||u.branchIds.indexOf(_ls.branchId)>=0;
      if(branchOk)found=u;
    });
    if(found){
      NX.session={
        userId:found.id,name:found.name,role:_ls.role,pin:_ls.pin,
        branchId:_ls.branchId,branchName:_ls.branchName,
        companyId:found.companyId||_ls.companyId||'alfaco',
        allowedModules:null
      };
      sessionStorage.setItem('nx_session',JSON.stringify(NX.session));
      bootApp();
    } else {
      pErr('Invalid PIN — try again');
    }
  });
}

function doLogout(){
  sessionStorage.removeItem('nx_session');
  NX.session=null;NX.page=null;BS={};
  document.getElementById('app').classList.remove('show');
  document.getElementById('login').classList.remove('gone');
  _ls={branchId:null,branchName:null,role:null,pin:'',companyId:null};
  loadBranches(renderStep0);
}

  db.ref('branches/'+b+'/sales').orderByChild('date').startAt(mo+'-01').endAt(mo+'-31').once('value',function(s){s.forEach(function(c){var v=c.val();if(v)mtdSales+=parseFloat(v.total||v.net||0);});fin();});

        kpi("Petty Cash",pcPend+" pending","Awaiting approval",ic('cash',28))+

      '<div class="sec-hdr"><div class="sec-title">Quick Access</div></div>'+
      '<div class="qa-grid">'+

        qa('petty-cash','cash','Petty Cash','#5B21B6')+
        qa('checklists','check','Checklists','#065F46')+
        qa('wastage','trash','Wastage','#9F1239')+

function drawDashChart(b,mo){
  var ctx=document.getElementById('dash-chart');if(!ctx||typeof Chart==='undefined')return;
  db.ref('branches/'+b+'/sales').orderByChild('date').startAt(mo+'-01').endAt(mo+'-31').once('value',function(snap){
    var byD={};snap.forEach(function(c){var v=c.val();if(v&&v.date)byD[v.date]=(byD[v.date]||0)+parseFloat(v.total||v.net||0);});
    var days=Object.keys(byD).sort();
    new Chart(ctx,{type:'bar',data:{labels:days.map(function(d){return d.slice(8);}),datasets:[{data:days.map(function(d){return Math.round(byD[d]);}),backgroundColor:'rgba(0,102,102,.2)',borderColor:'#006666',borderWidth:1.5,borderRadius:3}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:9},callback:function(v){return 'SAR '+v;}}},x:{grid:{display:false},ticks:{font:{size:9}}}}}});
  });

/* ═══ PETTY CASH ═══ */

        kpi("Approved",rows.filter(function(r){return r.status==='approved';}).length,"This period",ic('check',26))+
      '</div>'+

              '</select></td>';

        '</tbody></table></div>';

function saveSchedule(b,wk){
  var selects=document.querySelectorAll('[id^="sch-"]');
  var updates={};
  selects.forEach(function(sel){
    var sid=sel.dataset.sid;var day=sel.dataset.day;
    if(!updates[sid])updates[sid]={};
    updates[sid][day]=sel.value;
  });
  db.ref('branches/'+b+'/sch/'+wk).set(updates,function(err){
    if(err){toast('Save failed','e');return;}
    toast('Schedule saved','s');
  });
}
function getWK(){var d=new Date(),day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1),mon=new Date(new Date().setDate(diff));return mon.toISOString().slice(0,10);}

/* ═══ TIMESHEET ═══ */
function rTimesheet(){
  var c=document.getElementById('content'),b=bid();
  if(!b){c.innerHTML=rStub('timesheet');return;}
  var mo=BS._tsmo||TODAY.slice(0,7);
  c.innerHTML='<div class="sec-hdr mb-12"><input type="month" class="fi" style="width:170px" value="'+mo+'" onchange="BS._tsmo=this.value;rTimesheet()"><div class="muted">Timesheet — '+mo+'</div></div>'+
    '<div id="ts-body"><div class="muted" style="text-align:center;padding:24px">Loading…</div></div>';
  // tsAtt structure: {empId:{YYYY-MM:[records]}}
  db.ref('branches/'+b+'/tsAtt').once('value',function(snap){
    var raw=snap.val()||{};
    var rows=[];
    // Iterate by empId key — never use Object.values on tsAtt
    Object.keys(raw).forEach(function(empId){
      var empData=raw[empId];
      if(!empData)return;
      var moRecs=empData[mo];
      if(!moRecs)return;
      var recsArr=Array.isArray(moRecs)?moRecs:Object.values(moRecs);
      var totalMins=0;var presentDays=0;var lateDays=0;
      recsArr.filter(Boolean).forEach(function(r){
        if(r.workedMins){totalMins+=parseFloat(r.workedMins)||0;presentDays++;}
        if(r.late)lateDays++;
      });
      rows.push({empId,name:recsArr.find(function(r){return r&&r.name;})?recsArr.find(function(r){return r&&r.name;}).name:empId,totalMins,presentDays,lateDays});
    });
    rows.sort(function(a,z){return a.name.localeCompare(z.name);});
    var el=document.getElementById('ts-body');if(!el)return;
    el.innerHTML=
      '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">'+
        kpi('Employees',rows.length,'With records',ic('users',26))+
        kpi('Avg Days',rows.length?Math.round(rows.reduce(function(a,r){return a+r.presentDays;},0)/rows.length):0,'Present this month',ic('calendar',26))+
        kpi('Avg Hours',rows.length?fmtHm(rows.reduce(function(a,r){return a+r.totalMins;},0)/rows.length*60000):'—','Per employee',ic('clock',26))+
      '</div>'+
      '<div class="tbl"><table><thead><tr><th>Employee</th><th>ID</th><th>Days Present</th><th>Late</th><th>Total Hours</th></tr></thead><tbody>'+
      (rows.length?rows.map(function(r){
        return '<tr>'+
          '<td style="font-weight:700">'+he(r.name)+'</td>'+
          '<td class="td-mono muted">'+he(r.empId)+'</td>'+
          '<td class="td-r td-mono">'+r.presentDays+'</td>'+
          '<td class="td-r td-mono" style="color:'+(r.lateDays?'var(--warning)':'inherit')+'">'+r.lateDays+'</td>'+
          '<td class="td-r td-mono" style="font-weight:700">'+fmtHm(r.totalMins*60000)+'</td>'+
        '</tr>';
      }).join(''):'<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text3)">No timesheet records for '+mo+'</td></tr>')+
      '</tbody></table></div>';
  });
}
function fmtHm(ms){var m=Math.floor((ms||0)/60000);var h=Math.floor(m/60);return h+'h '+(m%60)+'m';}

/* ═══ P&L STATEMENT ═══ */
function rPnL(){
  var c=document.getElementById('content'),b=bid();
  var mo=BS._pnlMo||TODAY.slice(0,7);
  var refB=b||Object.keys(NX.branches)[0];
  if(!refB){c.innerHTML=rStub('hrf-pnl');return;}
  c.innerHTML='<div class="sec-hdr mb-12"><input type="month" class="fi" style="width:170px" value="'+mo+'" onchange="BS._pnlMo=this.value;rPnL()"><div class="muted">P&L — '+mo+'</div></div>'+
    '<div id="pnl-body"><div class="muted" style="text-align:center;padding:24px">Loading all data…</div></div>';

  var revenue=0,foodCost=0,pcTotal=0,compliance=0,payroll=0;
  var loaded=0;var total=4;
  function done(){loaded++;if(loaded<total)return;buildPnL();}

  db.ref('branches/'+refB+'/sales').orderByChild('date').startAt(mo+'-01').endAt(mo+'-31').once('value',function(s){
    s.forEach(function(ch){var v=ch.val();if(v)revenue+=parseFloat(v.total||v.net||0);});done();});
  db.ref('branches/'+refB+'/waste').orderByChild('date').startAt(mo+'-01').endAt(mo+'-31').once('value',function(s){
    s.forEach(function(ch){var v=ch.val();if(v)foodCost+=parseFloat(v.cost||0);});done();});
  db.ref('branches/'+refB+'/pc').orderByChild('date').startAt(mo+'-01').endAt(mo+'-31').once('value',function(s){
    s.forEach(function(ch){var v=ch.val();if(v&&v.status==='approved')pcTotal+=parseFloat(v.amount||0);});done();});
  db.ref('branches/'+refB+'/compliance').once('value',function(s){
    var d=s.val()||{};Object.values(d).forEach(function(v){if(v&&v.amount)compliance+=parseFloat(v.amount)||0;});done();});

  function buildPnL(){
    var gross=revenue;var totalCosts=foodCost+pcTotal+compliance+payroll;var net=gross-totalCosts;
    var gpm=gross?((gross-foodCost)/gross*100):0;var npm=gross?(net/gross*100):0;
    var el=document.getElementById('pnl-body');if(!el)return;
    el.innerHTML=
      '<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">'+
        kpi('Revenue','SAR '+fmt(gross,0),'Total sales',ic('money',26))+
        kpi('Total Costs','SAR '+fmt(totalCosts,0),'All expenses',ic('trash',26))+
        kpi('Net Profit','SAR '+fmt(net,0),net>=0?'Profitable':'Loss',ic('chart',26))+
        kpi('Net Margin',fmt(npm,1)+'%','Of revenue',ic('chart',26))+
      '</div>'+
      '<div class="g2">'+
        '<div class="card">'+
          '<div class="card-title"><div class="card-acc"></div>Income</div>'+
          pnlRow('Food & Bev Revenue','SAR '+fmt(revenue,2),true)+
          '<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid rgba(0,0,0,.08);margin-top:4px">'+
            '<span style="font-size:12px;font-weight:700">Gross Revenue</span>'+
            '<span style="font-size:14px;font-weight:700;color:var(--success)">SAR '+fmt(gross,2)+'</span>'+
          '</div>'+
        '</div>'+
        '<div class="card">'+
          '<div class="card-title"><div class="card-acc"></div>Expenses</div>'+
          pnlRow('Food Cost (Wastage)','SAR '+fmt(foodCost,2))+
          pnlRow('Petty Cash (Approved)','SAR '+fmt(pcTotal,2))+
          pnlRow('Fixed Costs','SAR '+fmt(compliance,2))+
          pnlRow('Payroll Estimate','SAR '+fmt(payroll,2))+
          '<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid rgba(0,0,0,.08);margin-top:4px">'+
            '<span style="font-size:12px;font-weight:700">Total Expenses</span>'+
            '<span style="font-size:14px;font-weight:700;color:var(--danger)">SAR '+fmt(totalCosts,2)+'</span>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title"><div class="card-acc"></div>Bottom Line</div>'+
        '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0">'+
          '<div>'+
            '<div style="font-size:13px;font-weight:700">Net Profit / Loss</div>'+
            '<div class="muted">'+mo+' · '+he(refB)+'</div>'+
          '</div>'+
          '<div style="font-size:28px;font-weight:700;color:'+(net>=0?'var(--success)':'var(--danger)')+'">'+
            (net>=0?'+':'')+' SAR '+fmt(net,2)+
          '</div>'+
        '</div>'+
        '<div class="mbar-w"><div class="mbar-f" style="width:'+Math.min(Math.abs(npm),100)+'%;background:'+(net>=0?'var(--success)':'var(--danger)')+'"></div></div>'+
        '<div class="muted" style="margin-top:4px">Gross margin: '+fmt(gpm,1)+'%  ·  Net margin: '+fmt(npm,1)+'%</div>'+
      '</div>';
  }
}

function savePIN(b,sid,i){

  // Save to staff record
  db.ref('branches/'+b+'/staff').once('value',function(snap){
    var raw=snap.val();
    if(!raw){toast('Staff not found','e');return;}
    if(Array.isArray(raw)){
      var idx=parseInt(i);if(raw[idx])db.ref('branches/'+b+'/staff/'+idx+'/pin').set(pin);

      Object.keys(raw).forEach(function(k){if((raw[k].id||raw[k].staffId||k)===sid)db.ref('branches/'+b+'/staff/'+k+'/pin').set(pin);});

/* ═══ ALERTS ENGINE ═══ */
var _alertCount=0;
function loadAlerts(){
  var b=bid();if(!b)return;
  _alertCount=0;
  var alerts=[];
  var done=0;var total=3;
  function fin(){done++;if(done<total)return;
    _alertCount=alerts.length;
    var nb=document.getElementById('nb-low');
    if(nb)nb.textContent=_alertCount||'';
    if(nb)nb.style.display=_alertCount?'inline':'none';
  }
  // Health card expiry
  var now=new Date();var soon=new Date();soon.setDate(soon.getDate()+30);
  db.ref('branches/'+b+'/health').once('value',function(snap){
    var raw=snap.val()||{};
    (Array.isArray(raw)?raw:Object.values(raw)).filter(Boolean).forEach(function(r){
      if(r.expiry){var exp=new Date(r.expiry);if(exp<now)alerts.push({type:'Health Card Expired',msg:r.name+' — expired '+r.expiry,level:'e'});
      else if(exp<=soon)alerts.push({type:'Health Card Expiring',msg:r.name+' — expires '+r.expiry,level:'w'});}
    });fin();
  });
  // Low stock
  db.ref('branches/'+b+'/inv_items').once('value',function(snap){
    var items=[];var raw=snap.val()||{};
    (Array.isArray(raw)?raw:Object.values(raw)).filter(Boolean).forEach(function(v){items.push(v);});
    db.ref('branches/'+b+'/stock').once('value',function(ss){
      var stock=ss.val()||{};
      items.forEach(function(it){
        var safe=String(it.code||'').replace(/[.#$\[\]\/]/g,'_');
        var qty=stock[safe]||it.qty||0;
        if(qty<=(it.min||0))alerts.push({type:'Low Stock',msg:(it.name||it.code)+' — '+qty+' '+it.unit+' remaining',level:'w'});
      });
      fin();
    });
  });
  // PC pending
  db.ref('branches/'+b+'/pc').orderByChild('status').equalTo('pending').once('value',function(snap){
    snap.forEach(function(ch){var v=ch.val();if(v)alerts.push({type:'Petty Cash Pending',msg:(v.desc||v.vendor||'Request')+' — SAR '+fmt(v.amount,2),level:'i'});});
    fin();
  });
  // Store for alerts page
  window._alerts=alerts;
}

function rAlerts(){
  var c=document.getElementById('content');
  var alerts=window._alerts||[];
  if(!alerts.length){
    loadAlerts();
    setTimeout(function(){renderAlertsList();},800);
  } else renderAlertsList();
}
function renderAlertsList(){
  var c=document.getElementById('content');
  var alerts=window._alerts||[];
  var byLevel={e:alerts.filter(function(a){return a.level==='e';}),w:alerts.filter(function(a){return a.level==='w';}),i:alerts.filter(function(a){return a.level==='i';})};
  c.innerHTML=
    '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">'+
      kpi('Critical',byLevel.e.length,'Immediate action',ic('bell',26))+
      kpi('Warnings',byLevel.w.length,'Attention needed',ic('clock',26))+
      kpi('Info',byLevel.i.length,'FYI',ic('check',26))+
    '</div>'+
    (alerts.length?alerts.map(function(a){
      var bc={e:'br',w:'ba',i:'bb'}[a.level]||'bk';
      var border={e:'var(--danger)',w:'var(--warning)',i:'var(--info)'}[a.level]||'var(--primary)';
      return '<div class="card mb-12" style="border-left:3px solid '+border+'">'+
        '<div style="display:flex;align-items:center;gap:10px">'+
          '<div style="flex:1">'+
            '<div style="font-size:11px;font-weight:700;margin-bottom:2px"><span class="badge '+bc+'" style="margin-right:6px">'+he(a.type)+'</span></div>'+
            '<div style="font-size:12px;color:var(--text2)">'+he(a.msg)+'</div>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join(''):'<div class="empty" style="height:200px"><div class="empty-txt">✓ No active alerts</div></div>');
}

/* ═══ CSV IMPORT — HEALTH CARDS ═══ */
function openHealthCSV(){
  var b=bid();
  openModal('<div class="modal-head"><div class="modal-title">Import Health Cards (CSV)</div><button class="modal-x" onclick="closeModal()">✕</button></div>'+
    '<div class="muted" style="margin-bottom:12px">CSV format: Name, SAP, Card Number, Expiry (YYYY-MM-DD)</div>'+
    '<div class="fg"><label class="fl">Select CSV File</label><input type="file" id="hc-file" accept=".csv" class="fi"></div>'+
    '<div id="hc-preview" style="margin-top:10px"></div>'+
    '<div class="flex-g" style="justify-content:flex-end;margin-top:6px">'+
    '<button class="btn" onclick="closeModal()">Cancel</button>'+
    '<button class="btn btn-primary" id="hc-import-btn" onclick="importHealthCSV(\''+b+'\')" style="display:none">Import</button></div>');
  document.getElementById('hc-file').onchange=function(e){
    var file=e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      var lines=ev.target.result.split('\n').filter(Boolean);
      var parsed=lines.slice(1).map(function(l){
        var p=l.split(',').map(function(x){return x.trim().replace(/^"|"$/g,'');});
        return{name:p[0]||'',sap:p[1]||'',cardNo:p[2]||'',expiry:p[3]||''};
      }).filter(function(r){return r.name;});
      window._hcParsed=parsed;
      var prev=document.getElementById('hc-preview');
      if(prev)prev.innerHTML='<div class="muted" style="margin-bottom:6px">Preview ('+parsed.length+' records):</div>'+
        '<div class="tbl"><table><thead><tr><th>Name</th><th>SAP</th><th>Card #</th><th>Expiry</th></tr></thead><tbody>'+
        parsed.slice(0,5).map(function(r){return '<tr><td>'+he(r.name)+'</td><td>'+he(r.sap)+'</td><td>'+he(r.cardNo)+'</td><td>'+he(r.expiry)+'</td></tr>';}).join('')+
        (parsed.length>5?'<tr><td colspan="4" style="text-align:center;color:var(--text3)">…and '+(parsed.length-5)+' more</td></tr>':'')+
        '</tbody></table></div>';
      var btn=document.getElementById('hc-import-btn');
      if(btn)btn.style.display='inline-flex';
    };
    reader.readAsText(file);
  };
}
function importHealthCSV(b){
  var parsed=window._hcParsed||[];
  if(!parsed.length){toast('No records to import','e');return;}
  var updates={};
  parsed.forEach(function(r,i){updates['hc_'+Date.now()+'_'+i]=r;});
  db.ref('branches/'+b+'/health').update(updates,function(err){
    if(err){toast('Import failed','e');return;}
    toast('Imported '+parsed.length+' health cards','s');closeModal();rHealth();
  });
}

/* ═══ PRAYER TIMES WIDGET ═══ */
var _prayers=null;
function loadPrayers(){
  if(_prayers)return;
  var lat=21.3891;var lng=39.8579;// Makkah default
  fetch('https://api.aladhan.com/v1/timings/'+TODAY+'?latitude='+lat+'&longitude='+lng+'&method=4')
    .then(function(r){return r.json();})
    .then(function(data){
      if(data&&data.data&&data.data.timings){
        _prayers=data.data.timings;
        renderPrayerWidget();
      }
    }).catch(function(){});
}
function renderPrayerWidget(){
  var el=document.getElementById('prayer-widget');
  if(!el||!_prayers)return;
  var names=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];
  var now=new Date();
  var nowMins=now.getHours()*60+now.getMinutes();
  var next=null;
  names.forEach(function(n){
    var t=_prayers[n];if(!t)return;
    var parts=t.split(':');var mins=parseInt(parts[0])*60+parseInt(parts[1]);
    if(mins>nowMins&&!next)next={name:n,time:t};
  });
  el.innerHTML='<div style="display:flex;gap:8px;flex-wrap:wrap">'+
    names.filter(function(n){return _prayers[n];}).map(function(n){
      var isNext=next&&next.name===n;
      return '<div style="text-align:center;padding:6px 10px;border-radius:8px;background:'+(isNext?'var(--primary)':'var(--base-dk)')+'">'+
        '<div style="font-size:8px;color:'+(isNext?'rgba(255,255,255,.7)':'var(--text3)')+'">'+n+'</div>'+
        '<div style="font-size:11px;font-weight:700;color:'+(isNext?'#fff':'var(--text)')+'">'+_prayers[n]+'</div>'+
      '</div>';
    }).join('')+
  '</div>';
}
