<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALFA.CO — Operations Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   TOKENS — neumorphism design system (from skill)
   surface=#E7E5E4 primary=#006666 font=Space Mono
═══════════════════════════════════════════════════ */
:root {
  --surface:   #E7E5E4;
  --surface-2: #dddbd9;
  --surface-3: #d3d1cf;
  --text:      #1E2938;
  --text-2:    #4a5568;
  --text-3:    #718096;
  --primary:   #006666;
  --primary-h: #008080;
  --success:   #00A63D;
  --warning:   #FE9900;
  --danger:    #FF2157;
  --shadow-out: 6px 6px 14px #c8c6c4, -6px -6px 14px #ffffff;
  --shadow-in:  inset 4px 4px 10px #c8c6c4, inset -4px -4px 10px #ffffff;
  --shadow-btn: 4px 4px 10px #c8c6c4, -4px -4px 10px #ffffff;
  --shadow-press: inset 3px 3px 8px #c8c6c4, inset -3px -3px 8px #ffffff;
  --r: 14px;
  --r-sm: 8px;
}
[data-theme="dark"] {
  --surface:   #1e2028;
  --surface-2: #262830;
  --surface-3: #2e3038;
  --text:      #e8eaf0;
  --text-2:    #b0b8c8;
  --text-3:    #5b6478;
  --shadow-out: 6px 6px 16px #13141a, -6px -6px 16px #292b35;
  --shadow-in:  inset 4px 4px 10px #13141a, inset -4px -4px 10px #292b35;
  --shadow-btn: 4px 4px 10px #13141a, -4px -4px 10px #292b35;
  --shadow-press: inset 3px 3px 8px #13141a, inset -3px -3px 8px #292b35;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Space Mono',monospace;
  background:var(--surface);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  transition:background .25s,color .25s;
}
/* Logo */
.logo{text-align:center;margin-bottom:24px}
.logo-mark{display:inline-flex;align-items:center;gap:10px;margin-bottom:5px}
.logo-icon{
  width:40px;height:40px;border-radius:10px;
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:3px 3px 10px rgba(0,102,102,.4);
}
.logo-text{font-size:20px;font-weight:700;letter-spacing:3px;color:var(--primary)}
.logo-sub{font-size:9px;color:var(--text-3);letter-spacing:3px;text-transform:uppercase}
/* Card */
.card{
  width:100%;max-width:460px;
  background:var(--surface);
  border-radius:var(--r);
  box-shadow:var(--shadow-out);
  padding:26px 22px;
}
/* Step title */
.stitle{
  font-size:10px;font-weight:700;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--text-3);
  text-align:center;margin-bottom:18px;
}
/* Role grid — 2 cols */
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.role-card{
  background:var(--surface);
  border-radius:var(--r-sm);
  box-shadow:var(--shadow-btn);
  padding:13px 11px;
  cursor:pointer;
  display:flex;align-items:center;gap:10px;
  border:2px solid transparent;
  transition:all .13s ease;
  user-select:none;
}
.role-card:hover{
  box-shadow:var(--shadow-out);
  border-color:var(--rc,var(--primary));
  transform:translateY(-1px);
}
.role-card:active{box-shadow:var(--shadow-press);transform:none}
.ri{
  width:36px;height:36px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--rc,var(--primary));
}
.ri svg{width:18px;height:18px}
.rl strong{display:block;font-size:11px;font-weight:700;color:var(--text);line-height:1.3}
.rl small{font-size:9px;color:var(--text-3)}
/* Back btn */
.back-btn{
  background:none;border:none;cursor:pointer;
  font-family:'Space Mono',monospace;
  font-size:10px;color:var(--text-3);
  display:flex;align-items:center;gap:5px;
  padding:0 0 10px;transition:color .12s;
}
.back-btn:hover{color:var(--primary)}
/* Branch list */
.branch-list{display:flex;flex-direction:column;gap:7px;max-height:300px;overflow-y:auto}
.branch-item{
  background:var(--surface);box-shadow:var(--shadow-btn);
  border-radius:var(--r-sm);padding:11px 13px;
  cursor:pointer;display:flex;align-items:center;gap:10px;
  border:2px solid transparent;transition:all .13s;
}
.branch-item:hover{border-color:var(--primary)}
.branch-item:active{box-shadow:var(--shadow-press)}
.bdot{width:7px;height:7px;border-radius:50%;background:var(--primary);flex-shrink:0}
.bn{font-size:12px;font-weight:700;color:var(--text)}
.bl{font-size:9px;color:var(--text-3)}
/* Role header (pin step) */
.rh{text-align:center;padding:8px 0 4px}
.rh-icon{
  width:52px;height:52px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 8px;color:#fff;
}
.rh-icon svg{width:24px;height:24px}
.rh-name{font-size:14px;font-weight:700}
.rh-hint{font-size:10px;color:var(--text-3);margin-top:3px}
/* PIN dots */
.pin-dots{display:flex;justify-content:center;gap:13px;margin:18px 0 8px}
.pd{
  width:13px;height:13px;border-radius:50%;
  background:var(--surface-3);box-shadow:var(--shadow-in);
  transition:background .12s;
}
.pd.on{background:var(--primary);box-shadow:none}
.pin-err{text-align:center;font-size:10px;color:var(--danger);min-height:15px;margin:5px 0}
/* PIN grid */
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
.pb{
  background:var(--surface);box-shadow:var(--shadow-btn);
  border:none;border-radius:var(--r-sm);
  font-family:'Space Mono',monospace;font-size:18px;font-weight:700;
  color:var(--text);height:52px;cursor:pointer;transition:all .11s;
}
.pb:hover{box-shadow:var(--shadow-out)}
.pb:active{box-shadow:var(--shadow-press)}
.pb.del{font-size:13px;color:var(--text-3)}
/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--surface);box-shadow:var(--shadow-btn);
  border:none;border-radius:var(--r-sm);
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  color:var(--text);padding:10px 16px;cursor:pointer;transition:all .12s;
  width:100%;
}
.btn:hover{box-shadow:var(--shadow-out)}
.btn:active{box-shadow:var(--shadow-press)}
.btn-p{
  background:var(--primary);color:#fff;
  box-shadow:4px 4px 12px rgba(0,102,102,.4);
}
.btn-p:hover{background:var(--primary-h)}
/* Theme toggle */
.theme-btn{
  position:fixed;top:14px;right:14px;
  background:var(--surface);box-shadow:var(--shadow-btn);
  border:none;border-radius:var(--r-sm);
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-3);transition:all .12s;
}
.theme-btn:hover{box-shadow:var(--shadow-out);color:var(--primary)}
/* Spinner */
.spin{
  display:inline-block;width:20px;height:20px;
  border:2px solid color-mix(in srgb,var(--primary) 25%,transparent);
  border-top-color:var(--primary);border-radius:50%;
  animation:_sp .7s linear infinite;
}
@keyframes _sp{to{transform:rotate(360deg)}}
/* Resume card */
.resume-role{
  background:var(--surface-2);border-radius:var(--r-sm);
  padding:13px;margin-bottom:14px;
  display:flex;align-items:center;gap:12px;
}
/* Staff link */
.staff-link{
  text-align:center;margin-top:14px;
  font-size:9px;color:var(--text-3);letter-spacing:1px;
}
.staff-link a{color:var(--primary);text-decoration:none;font-weight:700}
/* Conn */
.conn-bar{
  position:fixed;bottom:12px;right:14px;
  display:flex;align-items:center;gap:5px;
  font-size:8px;color:var(--text-3);letter-spacing:1px;
}
.cdot{width:5px;height:5px;border-radius:50%;background:var(--danger)}
.cdot.on{background:var(--success)}
/* Scrollbar */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--text-3);border-radius:2px}
</style>
</head>
<body>

<!-- Theme toggle -->
<button class="theme-btn" onclick="toggleTheme()" title="Toggle dark/light">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
    <circle cx="12" cy="12" r="4"/>
    <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
</button>

<!-- Logo -->
<div class="logo">
  <img src="https://i.imgur.com/jeqtcE2.png" alt="ALFA.CO" style="width:220px;max-width:90%;height:auto;display:block;margin:0 auto 6px"/>
  <div class="logo-sub">Operations Platform</div>
</div>

<!-- Login card -->
<div class="card" id="card"></div>

<!-- Staff portal link -->
<div class="staff-link">
  Staff member? <a href="staff-portal.html" target="_blank">Open Staff Portal →</a>
</div>

<!-- Connection indicator -->
<div class="conn-bar">
  <div class="cdot" id="cdot"></div>
  <span id="clbl">CONNECTING</span>
</div>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ════════════════════════════════════════════════════
   FIREBASE INIT
════════════════════════════════════════════════════ */
var FB_CONFIG = {
  apiKey:            "AIzaSyB9DhSn5gDqAhpmLG9aVFAld1dSRYJWFDI",
  authDomain:        "opshub-f802f.firebaseapp.com",
  databaseURL:       "https://opshub-f802f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "opshub-f802f",
  storageBucket:     "opshub-f802f.firebasestorage.app",
  messagingSenderId: "84176854270",
  appId:             "1:84176854270:web:f7a66b3b38e98b630859af"
};
var db = null;
try {
  firebase.initializeApp(FB_CONFIG);
  db = firebase.database();
  db.ref('.info/connected').on('value', function(s) {
    var ok = !!s.val();
    document.getElementById('cdot').className = 'cdot' + (ok ? ' on' : '');
    document.getElementById('clbl').textContent = ok ? 'ONLINE' : 'OFFLINE';
  });
} catch(e) { console.warn('Firebase:', e); }

/* ════════════════════════════════════════════════════
   THEME
════════════════════════════════════════════════════ */
var _theme = localStorage.getItem('alfa_theme') || 'dark';
document.documentElement.setAttribute('data-theme', _theme);
function toggleTheme() {
  _theme = _theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', _theme);
  localStorage.setItem('alfa_theme', _theme);
}

/* ════════════════════════════════════════════════════
   DATA STORE
════════════════════════════════════════════════════ */
var NX_BRANCHES = {};
var NX_USERS    = {};

/* ════════════════════════════════════════════════════
   ROLE DEFINITIONS
   icon: duo-line SVG per icon_design_skills.md
   file: which role html to redirect to
════════════════════════════════════════════════════ */
var ROLES = [
  {
    id:'super_admin', label:'Super Admin', sub:'Full system control',
    color:'#c0392b', file:'role-ceo.html',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>'
  },
  {
    id:'ceo', label:'CEO', sub:'Company overview',
    color:'#b45309', file:'role-ceo.html',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 20c0-3.5 3.6-6 8-6s8 2.5 8 6"/><path d="M17 2l2 2-2 2"/></svg>'
  },
  {
    id:'brand_dir', label:'Brand Director', sub:'Brand operations',
    color:'#7c3aed', file:'role-ceo.html',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>'
  },
  {
    id:'regional', label:'Area Manager', sub:'Region overview',
    color:'#1d4ed8', file:'role-ceo.html',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>'
  },
  {
    id:'branch_mgr', label:'Branch Manager', sub:'Select branch + PIN',
    color:'#006666', file:'role-branch.html',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>'
  },
  {
    id:'hr_manager', label:'HR Manager', sub:'People & payroll',
    color:'#475569', file:'role-hr.html',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>'
  },
  {
    id:'finance_dir', label:'Finance Director', sub:'Revenue & costs',
    color:'#d97706', file:'role-finance.html',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>'
  }
];

/* login state */
var LS = { role:null, pin:'', branchId:null, branchName:null };

/* ════════════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════════════ */
function xe(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function $c(){ return document.getElementById('card'); }

/* ════════════════════════════════════════════════════
   DATA LOAD
════════════════════════════════════════════════════ */
function loadData(cb) {
  if (!db) { setTimeout(function(){ loadData(cb); }, 500); return; }
  var n = 0;
  function done() { if (++n === 2) cb(); }

  db.ref('admin/branches').once('value', function(s) {
    NX_BRANCHES = {};
    Object.values(s.val()||{}).filter(Boolean).forEach(function(b){ if(b.id) NX_BRANCHES[b.id]=b; });
    done();
  });
  db.ref('admin/users').once('value', function(s) {
    NX_USERS = {};
    Object.values(s.val()||{}).filter(Boolean).forEach(function(u){ if(u.id) NX_USERS[u.id]=u; });
    done();
  });
}

/* ════════════════════════════════════════════════════
   STEP 0 — ROLE SELECTION
════════════════════════════════════════════════════ */
function renderStep0() {
  LS = { role:null, pin:'', branchId:null, branchName:null };
  $c().innerHTML =
    '<div class="stitle">Select Your Role</div>' +
    '<div class="role-grid">' +
    ROLES.map(function(r) {
      var bg = r.color + (document.documentElement.getAttribute('data-theme')==='dark'?'22':'18');
      return '<div class="role-card" style="--rc:'+r.color+'" onclick="selectRole(\''+r.id+'\')">'+
        '<div class="ri" style="background:'+bg+';color:'+r.color+'">'+r.icon+'</div>'+
        '<div class="rl"><strong>'+xe(r.label)+'</strong><small>'+xe(r.sub)+'</small></div>'+
        '</div>';
    }).join('')+
    '</div>';
}

/* ════════════════════════════════════════════════════
   ROLE SELECT → BRANCH or PIN
════════════════════════════════════════════════════ */
function selectRole(id) {
  LS.role = id; LS.pin = '';
  if (id === 'branch_mgr') renderBranchSelect();
  else renderPIN();
}

/* ════════════════════════════════════════════════════
   BRANCH SELECT
════════════════════════════════════════════════════ */
function renderBranchSelect() {
  var branches = Object.values(NX_BRANCHES).filter(Boolean).sort(function(a,b){
    return (a.name||'').localeCompare(b.name||'');
  });
  var html = '<button class="back-btn" onclick="renderStep0()">'+
    SVG_BACK+' Back</button>'+
    '<div class="stitle">Select Branch</div>'+
    '<div class="branch-list">';

  if (!branches.length) {
    html += '<div style="text-align:center;padding:24px"><div class="spin" style="margin:0 auto 10px"></div><div style="font-size:10px;color:var(--text-3)">Loading…</div></div>';
  } else {
    branches.forEach(function(b){
      html += '<div class="branch-item" onclick="pickBranch(\''+xe(b.id)+'\',\''+xe(b.name||b.id)+'\')">'+
        '<div class="bdot"></div><div>'+
        '<div class="bn">'+xe(b.name||b.id)+'</div>'+
        (b.location?'<div class="bl">'+xe(b.location)+'</div>':'')+
        '</div></div>';
    });
  }
  html += '</div>';
  $c().innerHTML = html;
}

function pickBranch(id, name) {
  LS.branchId = id; LS.branchName = name;
  renderPIN();
}

/* ════════════════════════════════════════════════════
   PIN STEP
════════════════════════════════════════════════════ */
var SVG_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="11" height="11"><polyline points="15 18 9 12 15 6"/></svg>';

function renderPIN() {
  LS.pin = '';
  var r = ROLES.find(function(x){ return x.id===LS.role; }) || ROLES[0];
  var hint = LS.branchName ? xe(LS.branchName) : 'Enter your PIN';
  var back = LS.role==='branch_mgr' ? 'renderBranchSelect()' : 'renderStep0()';

  $c().innerHTML =
    '<button class="back-btn" onclick="'+back+'">'+SVG_BACK+' Back</button>'+
    '<div class="rh">'+
      '<div class="rh-icon" style="background:'+r.color+'">'+r.icon+'</div>'+
      '<div class="rh-name" style="color:'+r.color+'">'+xe(r.label)+'</div>'+
      '<div class="rh-hint">'+hint+'</div>'+
    '</div>'+
    '<div class="pin-dots" id="pindots">'+
      '<div class="pd" id="pd0"></div><div class="pd" id="pd1"></div>'+
      '<div class="pd" id="pd2"></div><div class="pd" id="pd3"></div>'+
    '</div>'+
    '<div class="pin-err" id="perr"></div>'+
    '<div class="pin-grid">'+
    [1,2,3,4,5,6,7,8,9,null,0,'⌫'].map(function(k){
      if(k===null) return '<div></div>';
      if(k==='⌫') return '<button class="pb del" onclick="pdel()">⌫</button>';
      return '<button class="pb" onclick="ppress('+k+')">'+k+'</button>';
    }).join('')+
    '</div>';
}

function pdots() {
  for(var i=0;i<4;i++){
    var d=document.getElementById('pd'+i);
    if(d) d.className='pd'+(i<LS.pin.length?' on':'');
  }
}
function perr(msg){
  var e=document.getElementById('perr');
  if(e) e.textContent=msg;
  LS.pin=''; pdots();
}
function ppress(k){
  if(LS.pin.length>=4) return;
  LS.pin+=String(k);
  pdots();
  var e=document.getElementById('perr'); if(e) e.textContent='';
  if(LS.pin.length===4) setTimeout(verifyPIN,80);
}
function pdel(){ LS.pin=LS.pin.slice(0,-1); pdots(); }

/* ════════════════════════════════════════════════════
   VERIFY PIN
════════════════════════════════════════════════════ */
function verifyPIN() {
  var role = LS.role, pin = LS.pin;

  if (role === 'super_admin') {
    db.ref('admin/superpin').once('value', function(s){
      if(pin===String(s.val()||'0000')) launchRole({role:'super_admin',userName:'Super Admin',branchIds:Object.keys(NX_BRANCHES)});
      else perr('Incorrect PIN');
    });
    return;
  }

  if (role === 'branch_mgr') {
    if (!LS.branchId) { perr('No branch selected'); return; }
    // Try admin/branches/{id}/pin first
    db.ref('admin/branches/'+LS.branchId+'/pin').once('value', function(s){
      var stored = s.val() ? String(s.val()) : null;
      if (stored) {
        checkBranchPIN(stored, pin);
      } else {
        // Fallback: branches/{id}/config/pin
        db.ref('branches/'+LS.branchId+'/config/pin').once('value', function(s2){
          checkBranchPIN(String(s2.val()||'1234'), pin);
        });
      }
    });
    return;
  }

  // Named users (ceo, brand_dir, regional, hr_manager, finance_dir)
  var found = null;
  Object.values(NX_USERS).forEach(function(u){
    if(!found && u.role===role && String(u.pin||'')===pin) found=u;
  });

  if (found) {
    launchRole({ role:role, userId:found.id, userName:found.name||role,
      branchIds:found.branchIds||[], brandName:found.brandName||'', regionName:found.regionName||'' });
  } else {
    // Legacy fallback: admin/pins/{role}
    db.ref('admin/pins/'+role).once('value', function(s){
      if(pin===String(s.val()||'')) {
        var name = role==='ceo'?'CEO':role==='hr_manager'?'HR Manager':role==='finance_dir'?'Finance Director':role;
        launchRole({ role:role, userName:name, branchIds:Object.keys(NX_BRANCHES) });
      } else {
        perr('Incorrect PIN');
      }
    });
  }
}

function checkBranchPIN(stored, entered) {
  if(entered===stored) {
    var b = NX_BRANCHES[LS.branchId]||{};
    launchRole({ role:'branch_mgr', branchId:LS.branchId,
      branchName:LS.branchName||b.name||LS.branchId,
      branchIds:[LS.branchId], brandName:b.brand||'', regionName:b.location||'' });
  } else {
    perr('Incorrect PIN');
  }
}

/* ════════════════════════════════════════════════════
   LAUNCH — save session + redirect
════════════════════════════════════════════════════ */
function launchRole(sess) {
  sess.loginAt = Date.now();
  sess.theme   = _theme;
  var json = JSON.stringify(sess);
  try { sessionStorage.setItem('opshub_sess', json); } catch(e){}
  try { localStorage.setItem('opshub_sess', json); } catch(e){}

  var r = ROLES.find(function(x){ return x.id===sess.role; });
  var file = r ? r.file : 'role-branch.html';

  $c().innerHTML =
    '<div style="text-align:center;padding:44px 20px">'+
    '<div class="spin" style="width:26px;height:26px;border-width:3px;margin:0 auto 14px"></div>'+
    '<div style="font-size:11px;color:var(--text-3)">Launching…</div>'+
    '</div>';

  setTimeout(function(){ window.location.href = file; }, 380);
}

/* ════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════ */
window.onload = function(){
  _theme = localStorage.getItem('alfa_theme')||'dark';
  document.documentElement.setAttribute('data-theme', _theme);

  // Loading state
  $c().innerHTML = '<div style="text-align:center;padding:40px"><div class="spin" style="margin:0 auto 12px"></div><div style="font-size:10px;color:var(--text-3)">Connecting to Firebase…</div></div>';

  // Check for existing valid session
  var existing = null;
  try { existing = JSON.parse(localStorage.getItem('opshub_sess')||'null'); } catch(e){}
  if (existing && existing.role && (Date.now()-(existing.loginAt||0)) < 28800000) {
    loadData(function(){
      showResume(existing);
    });
    return;
  }

  loadData(function(){ renderStep0(); });
};

function showResume(sess) {
  var r = ROLES.find(function(x){ return x.id===sess.role; }) || ROLES[0];
  var bg = r.color + '22';
  $c().innerHTML =
    '<div class="stitle">Welcome Back</div>'+
    '<div class="resume-role">'+
      '<div class="ri" style="width:44px;height:44px;background:'+bg+';color:'+r.color+';border-radius:10px;flex-shrink:0">'+r.icon+'</div>'+
      '<div>'+
        '<div style="font-size:12px;font-weight:700">'+xe(sess.userName||r.label)+'</div>'+
        (sess.branchName?'<div style="font-size:10px;color:var(--text-3)">'+xe(sess.branchName)+'</div>':'')+
      '</div>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">'+
      '<button class="btn btn-p" onclick="doResume()">Continue →</button>'+
      '<button class="btn" onclick="doSwitch()">Switch User</button>'+
    '</div>';
  window._rsess = sess;
}

function doResume() {
  var r = ROLES.find(function(x){ return x.id===window._rsess.role; });
  window.location.href = r ? r.file : 'role-branch.html';
}

function doSwitch() {
  try { localStorage.removeItem('opshub_sess'); sessionStorage.removeItem('opshub_sess'); } catch(e){}
  renderStep0();
}
</script>
