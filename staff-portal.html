<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpsHub — Staff Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --base:#E7E5E4;--base-dk:#D4D2D1;--base-lt:#F5F3F2;
  --sd:rgba(0,0,0,.18);--sl:rgba(255,255,255,.88);
  --raise:6px 6px 16px var(--sd),-6px -6px 16px var(--sl);
  --raise-sm:3px 3px 8px var(--sd),-3px -3px 8px var(--sl);
  --raise-lg:10px 10px 28px var(--sd),-10px -10px 28px var(--sl);
  --inset:inset 4px 4px 10px rgba(0,0,0,.12),inset -4px -4px 10px rgba(255,255,255,.72);
  --inset-sm:inset 2px 2px 6px rgba(0,0,0,.10),inset -2px -2px 6px rgba(255,255,255,.65);
  --flat:2px 2px 5px var(--sd),-2px -2px 5px var(--sl);
  --primary:#006666;--primary-h:#008080;--primary-pale:rgba(0,102,102,.1);
  --success:#00A63D;--danger:#FF2157;--warning:#FE9900;--info:#0075CC;
  --text:#1E2938;--text2:rgba(30,41,56,.58);--text3:rgba(30,41,56,.35);
  --font:'Space Mono','Courier New',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;font-family:var(--font);color:var(--text);background:var(--base);font-size:13px}
button,input,select,textarea{font-family:var(--font);outline:none}
button{cursor:pointer;border:none}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--base-dk);border-radius:4px}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;z-index:999;background:var(--base);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#splash.gone{display:none}
.sp-icon{width:64px;height:64px;border-radius:18px;background:var(--primary);box-shadow:var(--raise-lg);display:flex;align-items:center;justify-content:center}
.sp-bar{width:44px;height:3px;border-radius:2px;background:var(--base-dk);overflow:hidden;position:relative}
.sp-bar::after{content:'';position:absolute;left:-100%;width:55%;height:100%;background:var(--primary);animation:sld 1s linear infinite}
@keyframes sld{to{left:160%}}

/* ── LOGIN ── */
#login{position:fixed;inset:0;z-index:500;background:var(--base);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#login.gone{display:none}
.lw{width:100%;max-width:380px}
.l-logo{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.l-logo-icon{width:44px;height:44px;background:var(--primary);border-radius:12px;box-shadow:var(--raise-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.l-title{font-size:17px;font-weight:700;color:var(--primary)}
.l-sub{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.l-card{background:var(--base);border-radius:18px;box-shadow:var(--raise-lg);padding:24px}
.l-step-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:16px}
.branch-list{display:flex;flex-direction:column;gap:7px;max-height:320px;overflow-y:auto}
.branch-btn{background:var(--base);border-radius:10px;box-shadow:var(--raise-sm);padding:10px 13px;cursor:pointer;display:flex;align-items:center;gap:9px;text-align:left;transition:all .15s;border:none;width:100%}
.branch-btn:hover{box-shadow:var(--raise);transform:translateY(-1px)}
.branch-btn:active{box-shadow:var(--inset-sm);transform:none}
.b-ico{width:28px;height:28px;border-radius:7px;background:var(--primary-pale);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.b-name{font-size:11px;font-weight:700;color:var(--text)}
.b-loc{font-size:9px;color:var(--text3);margin-top:1px}
.pin-dots{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.pin-dot{width:13px;height:13px;border-radius:50%;background:var(--base-dk);box-shadow:var(--inset-sm);transition:background .15s}
.pin-dot.on{background:var(--primary)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pin-key{background:var(--base);border-radius:11px;box-shadow:var(--raise-sm);height:50px;font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;user-select:none}
.pin-key:hover{box-shadow:var(--raise)}
.pin-key:active{box-shadow:var(--inset-sm)}
.pk-zero{grid-column:2}
.pk-del{grid-column:3;color:var(--text2);font-size:13px}
.l-back{font-size:10px;color:var(--text3);cursor:pointer;text-align:center;margin-top:11px;padding:4px}
.l-back:hover{color:var(--primary)}
.l-err{font-size:10px;color:var(--danger);text-align:center;min-height:16px;margin-top:-4px;margin-bottom:6px}

/* ── APP SHELL ── */
#app{display:none;min-height:100vh;flex-direction:column;max-width:520px;margin:0 auto}
#app.show{display:flex}

/* ── TOP BAR ── */
.top-bar{background:var(--base);border-bottom:1px solid rgba(0,0,0,.07);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:90;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.tb-left{display:flex;align-items:center;gap:10px}
.tb-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.tb-name{font-size:12px;font-weight:700;color:var(--text)}
.tb-branch{font-size:9px;color:var(--text3)}
.tb-logout{width:30px;height:30px;border-radius:8px;background:var(--base);box-shadow:var(--raise-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2)}
.tb-logout:hover{color:var(--danger)}
.tb-logout:active{box-shadow:var(--inset-sm)}

/* ── TAB BAR ── */
.tab-bar{background:var(--base);border-bottom:1px solid rgba(0,0,0,.07);display:flex;gap:2px;padding:8px 12px}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:9px;cursor:pointer;color:var(--text3);transition:all .15s;font-size:9px;font-weight:700}
.tab-item:hover{color:var(--text2)}
.tab-item.on{background:var(--base);box-shadow:var(--raise-sm);color:var(--primary)}
.tab-item svg{flex-shrink:0}

/* ── CONTENT ── */
#content{flex:1;padding:14px 16px;overflow-y:auto}

/* ── CARDS ── */
.card{background:var(--base);border-radius:13px;box-shadow:var(--raise);padding:14px;margin-bottom:12px}
.card-title{font-size:11px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.card-acc{width:3px;height:12px;border-radius:2px;background:var(--primary);flex-shrink:0}

/* ── KPI ROW ── */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.kpi-card{background:var(--base);border-radius:11px;box-shadow:var(--raise-sm);padding:11px 12px;border-top:2px solid var(--primary)}
.kpi-card:nth-child(2){border-top-color:#D97706}
.kpi-card:nth-child(3){border-top-color:#5B21B6}
.kpi-label{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.kpi-val{font-size:18px;font-weight:700;color:var(--text);line-height:1}
.kpi-sub{font-size:9px;color:var(--text2);margin-top:2px}

/* ── CHECK-IN BUTTON ── */
.checkin-btn{width:160px;height:160px;border-radius:50%;background:var(--base);box-shadow:var(--raise-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .2s;margin:0 auto;border:none;color:var(--primary)}
.checkin-btn:hover{transform:scale(1.02)}
.checkin-btn:active{box-shadow:var(--inset);transform:scale(.98)}
.checkin-btn.checked-in{color:var(--success)}
.checkin-btn.on-break{color:var(--warning)}
.checkin-btn-label{font-size:13px;font-weight:700;color:inherit;text-align:center;line-height:1.3}
.checkin-status{font-size:10px;color:var(--text3);text-align:center;margin-top:10px}
.checkin-time{font-size:14px;font-weight:700;color:var(--primary);text-align:center;font-family:var(--font)}

/* ── TABLES ── */
.tbl{border-radius:10px;box-shadow:var(--inset-sm);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--base-dk)}
th{padding:7px 10px;text-align:left;font-size:8px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
td{padding:8px 10px;font-size:11px;color:var(--text);border-bottom:1px solid rgba(0,0,0,.04)}
tbody tr:last-child td{border-bottom:none}
.td-r{text-align:right}
.td-mono{font-family:var(--font);font-size:10px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:9px;font-size:11px;font-weight:700;background:var(--base);box-shadow:var(--raise-sm);color:var(--text);cursor:pointer;transition:all .15s;font-family:var(--font);border:none}
.btn:hover{transform:translateY(-1px);box-shadow:var(--raise)}
.btn:active{box-shadow:var(--inset-sm);transform:none}
.btn-primary{background:var(--primary);color:#fff;box-shadow:3px 3px 10px rgba(0,102,102,.3),-2px -2px 8px rgba(255,255,255,.5)}
.btn-primary:hover{background:var(--primary-h)}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:5px 10px;font-size:10px;border-radius:7px}
.btn-block{width:100%;justify-content:center}

/* ── FORMS ── */
.fg{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.fl{font-size:8px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.fi,.fs,.fta{background:var(--base);box-shadow:var(--inset-sm);border-radius:8px;padding:7px 10px;font-size:11px;color:var(--text);font-family:var(--font);width:100%}
.fi:focus,.fs:focus,.fta:focus{box-shadow:var(--inset),0 0 0 2px var(--primary-pale)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:4px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.2px}
.bg{background:rgba(0,166,61,.12);color:#065F46}
.br{background:rgba(255,33,87,.12);color:#9F1239}
.ba{background:rgba(254,153,0,.14);color:#92400E}
.bb{background:rgba(0,117,204,.12);color:#1D4ED8}
.bk{background:rgba(0,0,0,.07);color:var(--text2)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(30,41,56,.32);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal-bg.gone{display:none}
.modal-sheet{background:var(--base);border-radius:18px 18px 0 0;box-shadow:var(--raise-lg);width:100%;max-width:520px;max-height:85vh;overflow-y:auto;padding:20px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-title{font-size:12px;font-weight:700;color:var(--text)}
.modal-x{width:24px;height:24px;border-radius:6px;background:var(--base);box-shadow:var(--raise-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:12px;border:none}
.modal-x:active{box-shadow:var(--inset-sm)}

/* ── TOASTS ── */
#toasts{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:7px;pointer-events:none;width:calc(100% - 32px);max-width:480px}
.toast{background:var(--base);border-radius:11px;box-shadow:var(--raise);padding:10px 13px;font-size:11px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;border-left:3px solid var(--primary);animation:tin .2s ease}
.toast.s{border-left-color:var(--success)}
.toast.e{border-left-color:var(--danger)}
.toast.w{border-left-color:var(--warning)}
@keyframes tin{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

/* ── MISC ── */
.muted{color:var(--text3);font-size:9px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;gap:10px;color:var(--text3)}
.empty-txt{font-size:11px;text-align:center}
.mbar-w{background:var(--base-dk);border-radius:3px;height:5px;overflow:hidden}
.mbar-f{height:100%;border-radius:3px;background:var(--primary);transition:width .5s}
.divider{height:1px;background:rgba(0,0,0,.06);margin:12px 0}
</style>

</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="sp-icon">
    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
    </svg>
  </div>
  <div style="font-size:17px;font-weight:700;color:var(--primary)">Staff Portal</div>
  <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px">OpsHub</div>
  <div class="sp-bar"></div>
</div>

<!-- LOGIN -->
<div id="login">
  <div class="lw">
    <div class="l-logo">
      <div class="l-logo-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </div>
      <div><div class="l-title">Staff Portal</div><div class="l-sub">OpsHub Self-Service</div></div>
    </div>
    <div class="l-card" id="l-card"><div class="l-step-title">Loading branches…</div></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="top-bar">
    <div class="tb-left">
      <div class="tb-avatar" id="tb-av">—</div>
      <div>
        <div class="tb-name" id="tb-name">—</div>
        <div class="tb-branch" id="tb-branch">—</div>
      </div>
    </div>
    <div class="tb-logout" onclick="doLogout()" title="Sign out">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
  </div>
  <div class="tab-bar" id="tab-bar"></div>
  <div id="content"></div>
</div>

<div class="modal-bg gone" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet" id="modal-box"></div>
</div>
<div id="toasts"></div>

<script>
/* ═══ FIREBASE ═══ */
firebase.initializeApp({
  apiKey:"AIzaSyDqhDGJCInvMMkVBCaW1f-6AFWW1gzniDQ",
  authDomain:"opshub-f802f.firebaseapp.com",
  databaseURL:"https://opshub-f802f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"opshub-f802f",storageBucket:"opshub-f802f.appspot.com",
  messagingSenderId:"560849491600",appId:"1:560849491600:web:4cb3a1a56ed7ee5f0d45ea"
});
var db=firebase.database();

/* ═══ STATE ═══ */
var SP={
  session:null,   // {staffId,sapId,name,branchId,branchName,pin,role}
  branches:{},
  tab:'checkin',
  checkState:null, // null|'in'|'break'
  checkKey:null,
  checkInTime:null,
  breakStart:null,
  totalBreak:0,
};
var TODAY=new Date().toISOString().slice(0,10);
var urlBranch=(new URLSearchParams(location.search)).get('branch');

/* ═══ HELPERS ═══ */
function he(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n,d){return(parseFloat(n)||0).toLocaleString('en',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function fmtTime(ms){var m=Math.floor(ms/60000);var h=Math.floor(m/60);return h+'h '+(m%60)+'m';}
function nowTs(){return Date.now();}
function toast(msg,t){
  var ts=document.getElementById('toasts');var el=document.createElement('div');
  el.className='toast '+(t||'');
  el.innerHTML='<span>'+(t==='s'?'✓':t==='e'?'✕':'·')+'</span><span>'+he(msg)+'</span>';
  ts.appendChild(el);setTimeout(function(){el.remove();},3200);
}
function openModal(h){document.getElementById('modal-box').innerHTML=h;document.getElementById('modal').classList.remove('gone');}
function closeModal(){document.getElementById('modal').classList.add('gone');}

/* ═══ STARTUP ═══ */
window.onload=function(){
  var s=sessionStorage.getItem('sp_session');
  if(s){try{SP.session=JSON.parse(s);bootApp();}catch(e){bootLogin();}}
  else bootLogin();
};

function bootLogin(){
  setTimeout(function(){document.getElementById('splash').classList.add('gone');},900);
  loadBranches(renderStep0);
}
function bootApp(){
  document.getElementById('splash').classList.add('gone');
  document.getElementById('login').classList.add('gone');
  document.getElementById('app').classList.add('show');
  updateTopBar();renderTabBar();
  // If deep-linked to branch, auto-set
  if(urlBranch&&!SP.session.branchId)SP.session.branchId=urlBranch;
  // Restore check-in state
  restoreCheckState(function(){switchTab('checkin');});
}

function loadBranches(cb){
  db.ref('admin/branches').once('value',function(s){
    SP.branches={};
    Object.values(s.val()||{}).filter(Boolean).forEach(function(b){if(b.id)SP.branches[b.id]=b;});
    // If url param matches, skip branch step
    if(urlBranch&&SP.branches[urlBranch]){
      _ls.branchId=urlBranch;
      _ls.branchName=SP.branches[urlBranch].name||urlBranch;
      _ls.companyId=SP.branches[urlBranch].companyId||'alfaco';
      if(cb)lShowPIN();
    } else {if(cb)cb();}
  });
}

/* ═══ LOGIN ═══ */
var _ls={branchId:null,branchName:null,companyId:null,pin:''};

function renderStep0(){
  var branches=Object.values(SP.branches);
  var card=document.getElementById('l-card');
  if(!branches.length){
    card.innerHTML='<div style="text-align:center;padding:20px;color:var(--text3);font-size:11px">No branches found. Contact admin.</div>';
    return;
  }
  card.innerHTML='<div class="l-step-title">Select your branch</div><div class="branch-list">'+
    branches.map(function(b){
      return '<button class="branch-btn" onclick="lBranch(\''+b.id+'\',\''+he(b.name)+'\',\''+he(b.companyId||'alfaco')+'\')">'+
        '<div class="b-ico">'+(b.icon||'🍽️')+'</div>'+
        '<div><div class="b-name">'+he(b.name)+'</div><div class="b-loc">'+he(b.brand||b.location||b.id)+'</div></div>'+
      '</button>';
    }).join('')+
  '</div>';
}

function lBranch(id,name,co){_ls.branchId=id;_ls.branchName=name;_ls.companyId=co;lShowPIN();}

function lShowPIN(){
  document.getElementById('l-card').innerHTML=
    '<div class="l-step-title">Enter your Staff PIN</div>'+
    '<div class="l-err" id="perr"></div>'+
    '<div class="pin-dots"><div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div><div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div></div>'+
    '<div class="pin-pad">'+
    [1,2,3,4,5,6,7,8,9].map(function(n){return '<div class="pin-key" onclick="pKey('+n+')">'+n+'</div>';}).join('')+
    '<div class="pin-key pk-zero" onclick="pKey(0)">0</div>'+
    '<div class="pin-key pk-del" onclick="pDel()">⌫</div>'+
    '</div>'+
    (urlBranch?'':'<div class="l-back" onclick="renderStep0()">← Back</div>');
}

function pKey(n){
  if(_ls.pin.length>=4)return;
  _ls.pin+=String(n);pDots();
  if(_ls.pin.length===4)setTimeout(checkPIN,220);
}
function pDel(){_ls.pin=_ls.pin.slice(0,-1);pDots();}
function pDots(){for(var i=0;i<4;i++){var e=document.getElementById('pd'+i);if(e)e.classList.toggle('on',i<_ls.pin.length);}}
function pErr(msg){var e=document.getElementById('perr');if(e)e.textContent=msg;_ls.pin='';pDots();setTimeout(function(){if(e)e.textContent='';},2500);}

function checkPIN(){
  // Search staff in branch by PIN
  var bid=_ls.branchId;
  db.ref('staff/'+bid).once('value',function(snap){
    var raw=snap.val();var found=null;
    if(!raw){pErr('No staff in this branch');return;}
    var list=Array.isArray(raw)?raw:Object.values(raw);
    list.filter(Boolean).forEach(function(s){
      if(String(s.pin||s.staffPin||'')===_ls.pin)found=s;
    });
    if(!found){
      // also try admin/users for captain/manager
      db.ref('admin/users').orderByChild('pin').equalTo(_ls.pin).once('value',function(us){
        var fu=null;
        us.forEach(function(c){var u=c.val();if(u&&(!u.branchIds||u.branchIds.indexOf(bid)>=0))fu=u;});
        if(fu){
          doLogin({name:fu.name,staffId:fu.id,sapId:fu.sapId||fu.id,role:fu.role||'staff'});
        } else {pErr('Invalid PIN');}
      });
      return;
    }
    doLogin({name:found.name,staffId:found.id||found.staffId,sapId:found.sap||found.sapId||found.id,role:found.role||'staff'});
  });
}

function doLogin(staff){

function getStatusText(){
  if(!SP.checkState)return 'Not checked in today';
  if(SP.checkState==='break')return '☕ On break — tap to end';
  return '✓ Checked in — '+new Date(SP.checkInTime).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}

function buildShiftInfo(){
  if(!SP.checkState)return '';
  var brk=SP.totalBreak+(SP.checkState==='break'?(nowTs()-(SP.breakStart||nowTs())):0);
  var worked=SP.checkInTime?(nowTs()-SP.checkInTime-brk):0;
  return '<div class="kpi-row" style="grid-template-columns:1fr 1fr">'+
    '<div class="kpi-card"><div class="kpi-label">Worked</div><div class="kpi-val" id="ci-worked">'+fmtHm(worked)+'</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">Break</div><div class="kpi-val" id="ci-brk">'+fmtHm(brk)+'</div></div>'+
  '</div>';
}

function fmtElapsed(inTime){
  var ms=nowTs()-inTime;var s=Math.floor(ms/1000);
  var h=Math.floor(s/3600);var m=Math.floor((s%3600)/60);var sec=s%60;
  return pad(h)+':'+pad(m)+':'+pad(sec);
}
function fmtHm(ms){var m=Math.floor(ms/60000);var h=Math.floor(m/60);return h+'h '+(m%60)+'m';}
function pad(n){return n<10?'0'+n:String(n);}

/* ── CHECK-IN ACTIONS ── */
function doCheckIn(){
  var s=SP.session;if(!s){toast('Not logged in','e');return;}
  var bid=s.branchId;var sid=s.staffId;var sap=s.sapId;
  var ts=nowTs();
  var key='ci_'+sid+'_'+ts;
  var rec={staffId:sid,sapId:sap,name:s.name,branchId:bid,inTime:ts,date:TODAY,outTime:null,onBreak:false,totalBreak:0,brkLogs:[],workedMins:0,workedHrs:0};
  db.ref('qr_checkins/'+bid+'/'+TODAY+'/'+key).set(rec,function(err){
    if(err){toast('Check-in failed','e');return;}
    SP.checkState='in';SP.checkKey=key;SP.checkInTime=ts;SP.totalBreak=0;SP.breakStart=null;
    toast('Checked in at '+new Date(ts).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),'s');
    rCheckin();
  });
}

function doBreakStart(){
  if(SP.checkState!=='in'){return;}
  var ts=nowTs();
  var bid=SP.session.branchId;var key=SP.checkKey;
  db.ref('qr_checkins/'+bid+'/'+TODAY+'/'+key).update({onBreak:true,breakStart:ts},function(err){
    if(err){toast('Failed','e');return;}
    SP.checkState='break';SP.breakStart=ts;
    toast('Break started','w');rCheckin();
  });
}

function doBreakEnd(){
  if(SP.checkState!=='break'){return;}
  var ts=nowTs();var dur=(ts-(SP.breakStart||ts));
  SP.totalBreak+=dur;
  var bid=SP.session.branchId;var key=SP.checkKey;
  var brkLog={start:SP.breakStart,end:ts,dur:dur};
  db.ref('qr_checkins/'+bid+'/'+TODAY+'/'+key).transaction(function(cur){
    if(cur===null)return cur;
    cur.onBreak=false;cur.breakStart=null;
    cur.totalBreak=(cur.totalBreak||0)+dur;
    cur.brkLogs=cur.brkLogs||[];cur.brkLogs.push(brkLog);
    return cur;
  },function(err){
    if(err){toast('Failed','e');return;}
    SP.checkState='in';SP.breakStart=null;
    toast('Break ended — '+fmtHm(dur),'s');rCheckin();
  });
}

function doCheckOut(){
  if(!SP.checkState){return;}
  if(SP.checkState==='break')doBreakEnd();
  var ts=nowTs();
  var bid=SP.session.branchId;var key=SP.checkKey;
  var inTime=SP.checkInTime||ts;
  var totalBreak=SP.totalBreak;
  var workedMs=ts-inTime-totalBreak;
  var workedMins=Math.round(workedMs/60000);
  var workedHrs=parseFloat((workedMins/60).toFixed(2));
  db.ref('qr_checkins/'+bid+'/'+TODAY+'/'+key).update({
    outTime:ts,onBreak:false,workedMins:workedMins,workedHrs:workedHrs,totalBreak:totalBreak
  },function(err){
    if(err){toast('Check-out failed','e');return;}
    SP.checkState=null;SP.checkKey=null;SP.checkInTime=null;SP.totalBreak=0;SP.breakStart=null;
    if(_ciTimer){clearInterval(_ciTimer);_ciTimer=null;}
    toast('Checked out — worked '+fmtHm(workedMs),'s');rCheckin();
  });
}

function loadTodayLog(){
  var s=SP.session;if(!s)return;
  db.ref('qr_checkins/'+s.branchId+'/'+TODAY).orderByChild('staffId').equalTo(s.staffId).once('value',function(snap){
    var rows=[];snap.forEach(function(ch){var v=ch.val();if(v)rows.push(v);});
    rows.sort(function(a,z){return (a.inTime||0)-(z.inTime||0);});
    var el=document.getElementById('ci-log-wrap');if(!el)return;
    if(!rows.length){el.innerHTML='';return;}
    el.innerHTML='<div class="card"><div class="card-title"><div class="card-acc"></div>Today\'s Log</div>'+
      rows.map(function(r){
        var worked=r.workedMins?fmtHm(r.workedMins*60000):(r.outTime?fmtHm(r.outTime-r.inTime-(r.totalBreak||0)):'In progress');
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.04)">'+
          '<div>'+
            '<div style="font-size:11px;font-weight:700">'+new Date(r.inTime||0).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})+(r.outTime?' → '+new Date(r.outTime).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}):'')+'</div>'+
            '<div class="muted">Break: '+fmtHm(r.totalBreak||0)+'</div>'+
          '</div>'+
          '<div style="font-size:12px;font-weight:700;color:'+(r.outTime?'var(--text)':'var(--primary)')+'">'+worked+'</div>'+
        '</div>';
      }).join('')+
    '</div>';
  });
}

/* ═══ ATTENDANCE ═══ */
function rAttendance(){
  var c=document.getElementById('content');
  var s=SP.session;if(!s){c.innerHTML='<div class="empty"><div class="empty-txt">Not logged in</div></div>';return;}
  var mo=new Date().toISOString().slice(0,7);
  var bid=s.branchId;var sid=s.staffId;var sap=s.sapId;

  // Pull from staff/checkins/{bid}/{YYYY-MM-*}
  c.innerHTML='<div class="empty"><div class="empty-txt">Loading attendance…</div></div>';

  // Collect all days in month
  var days=[];var d=new Date(mo+'-01');var now=new Date();
  while(d.toISOString().slice(0,7)===mo&&d<=now){days.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}

  var fetched=0;var logs=[];
  function next(){fetched++;if(fetched<days.length)return;render();}
  days.forEach(function(day){
    db.ref('qr_checkins/'+bid+'/'+day).orderByChild('staffId').equalTo(sid).once('value',function(snap){
      snap.forEach(function(ch){var v=ch.val();if(v)logs.push(Object.assign({date:day},v));});
      next();
    });
  });

  function render(){
    logs.sort(function(a,z){return a.date>z.date?1:-1;});
    var totalMins=logs.reduce(function(a,l){return a+(l.workedMins||0);},0);
    var presentDays=logs.filter(function(l){return l.inTime;}).length;
    var avgMins=presentDays?Math.round(totalMins/presentDays):0;

    c.innerHTML=
      '<div class="kpi-row">'+
        kpiCard('Days Present',presentDays,mo)+
        kpiCard('Total Hours',fmtHm(totalMins*60000),mo)+
        kpiCard('Avg/Day',fmtHm(avgMins*60000),'Daily avg')+
      '</div>'+
      '<div class="card" style="padding:0">'+
        '<table><thead><tr><th>Date</th><th>In</th><th>Out</th><th>Break</th><th>Worked</th><th>Status</th></tr></thead><tbody>'+
        (logs.length?logs.map(function(l){
          var worked=l.workedMins?fmtHm(l.workedMins*60000):(l.outTime?fmtHm(l.outTime-l.inTime-(l.totalBreak||0)):'—');
          var status=!l.inTime?'bk':!l.outTime?'ba':'bg';
          var statusTxt=!l.inTime?'Absent':!l.outTime?'Pending':'Present';
          return '<tr>'+
            '<td class="td-mono">'+he(l.date)+'</td>'+
            '<td class="td-mono">'+(l.inTime?new Date(l.inTime).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}):'—')+'</td>'+
            '<td class="td-mono">'+(l.outTime?new Date(l.outTime).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}):'—')+'</td>'+
            '<td class="td-mono">'+fmtHm(l.totalBreak||0)+'</td>'+
            '<td class="td-mono" style="font-weight:700">'+worked+'</td>'+
            '<td><span class="badge '+status+'">'+statusTxt+'</span></td>'+
          '</tr>';
        }).join(''):'<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text3)">No attendance records for '+mo+'</td></tr>')+
        '</tbody></table>'+
      '</div>';
  }
}

function kpiCard(label,val,sub){
  return '<div class="kpi-card">'+
    '<div class="kpi-label">'+he(label)+'</div>'+
    '<div class="kpi-val">'+he(String(val))+'</div>'+
    '<div class="kpi-sub">'+he(sub)+'</div>'+
  '</div>';
}

/* ═══ PAY SLIP ═══ */
function rPayslip(){
  var c=document.getElementById('content');
  var s=SP.session;if(!s){c.innerHTML='<div class="empty"><div class="empty-txt">Not logged in</div></div>';return;}
  var bid=s.branchId;var sid=s.staffId;var sap=s.sapId;

  // Try to find staff record for salary info
  db.ref('staff/'+bid).once('value',function(snap){
    var raw=snap.val();var staffRec=null;
    if(raw){
      var list=Array.isArray(raw)?raw:Object.values(raw);
      list.filter(Boolean).forEach(function(r){
        if(r.id===sid||r.staffId===sid||r.sap===sap||r.sapId===sap)staffRec=r;
      });
    }

    var mo=new Date().toISOString().slice(0,7);
    var basic=parseFloat(staffRec&&staffRec.salary||staffRec&&staffRec.basicSalary||0);
    var housing=parseFloat(staffRec&&staffRec.housingAllowance||0);
    var transport=parseFloat(staffRec&&staffRec.transportAllowance||0);
    var gosi=basic*0.0975;
    var gross=basic+housing+transport;
    var net=gross-gosi;

    c.innerHTML=
      '<div class="card">'+
        '<div class="card-title"><div class="card-acc"></div>Pay Slip — '+mo+'</div>'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">'+
          '<div>'+
            '<div style="font-size:13px;font-weight:700">'+he(s.name||'')+'</div>'+
            '<div class="muted">SAP: '+he(sap||'—')+'  ·  '+he(bid)+'</div>'+
          '</div>'+
          '<div style="text-align:right">'+
            '<div style="font-size:18px;font-weight:700;color:var(--primary)">SAR '+fmt(net,2)+'</div>'+
            '<div class="muted">Net Pay</div>'+
          '</div>'+
        '</div>'+
        '<div class="divider"></div>'+
        row('Basic Salary','SAR '+fmt(basic,2),'+')+
        row('Housing Allowance','SAR '+fmt(housing,2),'+')+
        row('Transport Allowance','SAR '+fmt(transport,2),'+')+
        '<div class="divider"></div>'+
        row('Gross Pay','SAR '+fmt(gross,2),'')+
        row('GOSI (9.75%)','SAR '+fmt(gosi,2),'-')+
        '<div class="divider"></div>'+
        '<div style="display:flex;justify-content:space-between;padding:8px 0">'+
          '<div style="font-size:12px;font-weight:700">Net Pay</div>'+
          '<div style="font-size:16px;font-weight:700;color:var(--primary)">SAR '+fmt(net,2)+'</div>'+
        '</div>'+
        (basic===0?'<div class="muted" style="text-align:center;margin-top:8px">Salary details not configured — contact HR</div>':'')+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title"><div class="card-acc"></div>Leave Balance</div>'+
        row('Annual Leave',staffRec&&staffRec.annualLeave||'21 days','')+
        row('Sick Leave',staffRec&&staffRec.sickLeave||'10 days','')+
        row('Emergency',staffRec&&staffRec.emergencyLeave||'3 days','')+
      '</div>';
  });
}

function row(label,val,sign){
  var color=sign==='+'?'var(--success)':sign==='-'?'var(--danger)':'var(--text)';
  return '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.04)">'+
    '<span style="font-size:11px;color:var(--text2)">'+he(label)+'</span>'+
    '<span style="font-size:11px;font-weight:700;color:'+color+'">'+(sign?sign+' ':'')+he(String(val))+'</span>'+
  '</div>';
}

/* ═══ TRAINING ═══ */
var _quiz={active:null,idx:0,score:0,answers:[]};

function rTraining(){
  var c=document.getElementById('content');
  var s=SP.session;if(!s){c.innerHTML='<div class="empty"><div class="empty-txt">Not logged in</div></div>';return;}
  var bid=s.branchId;var sid=s.staffId;

  // Load modules published for this branch
  db.ref('config/'+bid+'/training_modules').once('value',function(snap){
    var mods=[];snap.forEach(function(ch){var v=ch.val();if(v&&v.published)mods.push(Object.assign({_k:ch.key},v));});
    if(!mods.length){
      c.innerHTML='<div class="empty" style="height:200px"><div class="empty-txt">No training modules published yet</div></div>';
      return;
    }
    // Check completions
    db.ref('config/'+bid+'/training_progress/'+sid).once('value',function(ps){
      var progress=ps.val()||{};
      c.innerHTML='<div style="margin-bottom:10px;font-size:10px;color:var(--text3)">'+mods.length+' module'+( mods.length!==1?'s':'')+' available</div>'+
        mods.map(function(m){
          var done=progress[m._k];
          var score=done?done.score:null;
          return '<div class="card" style="cursor:pointer" onclick="openModule(\''+m._k+'\',\''+he(m.title||'Module')+'\')">'+
            '<div style="display:flex;align-items:center;justify-content:space-between">'+
              '<div>'+
                '<div style="font-size:12px;font-weight:700;margin-bottom:2px">'+he(m.title||'Untitled Module')+'</div>'+
                '<div class="muted">'+(m.questions?m.questions.length:0)+' questions</div>'+
              '</div>'+
              '<div style="text-align:right">'+
                (done?'<span class="badge bg">Passed '+score+'%</span>':'<span class="badge bk">Not started</span>')+
              '</div>'+
            '</div>'+
          '</div>';
        }).join('');
    });
  });
}

function openModule(modKey,title){
  var s=SP.session;var bid=s.branchId;
  db.ref('staff/modules/'+bid+'/'+modKey).once('value',function(snap){
    var m=snap.val();if(!m||!m.questions||!m.questions.length){toast('No questions in this module','w');return;}
    _quiz={active:m,modKey:modKey,idx:0,score:0,answers:[],total:m.questions.length};
    showQuestion();
  });
}

function showQuestion(){
  var q=_quiz.active.questions[_quiz.idx];
  openModal(
    '<div class="modal-head">'+
      '<div class="modal-title">'+he(_quiz.active.title||'Quiz')+' — Q'+(_quiz.idx+1)+'/'+_quiz.total+'</div>'+
      '<button class="modal-x" onclick="closeModal()">✕</button>'+
    '</div>'+
    '<div style="margin-bottom:14px">'+
      '<div class="mbar-w"><div class="mbar-f" style="width:'+Math.round(_quiz.idx/_quiz.total*100)+'%"></div></div>'+
    '</div>'+
    '<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:16px;line-height:1.5">'+he(q.question||q.q||'')+'</div>'+
    '<div id="quiz-opts">'+
    (q.options||q.choices||[]).map(function(opt,i){
      return '<div class="card" style="cursor:pointer;margin-bottom:8px;box-shadow:var(--raise-sm)" onclick="selectAnswer('+i+')">'+
        '<div style="display:flex;align-items:center;gap:10px">'+
          '<div style="width:24px;height:24px;border-radius:6px;background:var(--base-dk);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">'+String.fromCharCode(65+i)+'</div>'+
          '<div style="font-size:11px;color:var(--text)">'+he(opt)+'</div>'+
        '</div>'+
      '</div>';
    }).join('')+
    '</div>'
  );
}

function selectAnswer(idx){
  var q=_quiz.active.questions[_quiz.idx];
  var correct=q.answer||q.correct||0;
  var isCorrect=(idx===correct||idx===parseInt(correct));
  if(isCorrect)_quiz.score++;
  _quiz.answers.push({q:_quiz.idx,chosen:idx,correct:correct,ok:isCorrect});

  // Flash feedback
  var opts=document.getElementById('quiz-opts');
  if(opts){
    var cards=opts.querySelectorAll('.card');
    cards.forEach(function(card,i){
      card.onclick=null;
      if(i===correct)card.style.background='rgba(0,166,61,.15)';
      else if(i===idx&&!isCorrect)card.style.background='rgba(255,33,87,.12)';
    });
  }

  setTimeout(function(){
    _quiz.idx++;
    if(_quiz.idx>=_quiz.total)finishQuiz();
    else showQuestion();
  },900);
}

function finishQuiz(){
  var pct=Math.round(_quiz.score/_quiz.total*100);
  var passed=pct>=70;
  var s=SP.session;var bid=s.branchId;var sid=s.staffId;

  // Save progress
  db.ref('config/'+bid+'/training_progress/'+sid+'/'+_quiz.modKey).set({
    score:pct,passed:passed,ts:Date.now(),total:_quiz.total,correct:_quiz.score
  });

  document.getElementById('modal-box').innerHTML=
    '<div style="text-align:center;padding:10px 0">'+
      '<div style="font-size:40px;margin-bottom:12px">'+(passed?'🎉':'📚')+'</div>'+
      '<div style="font-size:16px;font-weight:700;margin-bottom:6px">'+(passed?'Well done!':'Keep practising')+'</div>'+
      '<div style="font-size:28px;font-weight:700;color:'+(passed?'var(--success)':'var(--warning)')+'">'+pct+'%</div>'+
      '<div class="muted" style="margin:4px 0 16px">'+_quiz.score+' / '+_quiz.total+' correct</div>'+
      '<div class="muted" style="margin-bottom:16px">'+(passed?'You have passed this module.':'Score 70% or above to pass.')+'</div>'+
      '<button class="btn btn-primary btn-block" onclick="closeModal();rTraining()">Done</button>'+
    '</div>';
}

/* ═══ INIT ═══ */
</script>
</body>
</html>
