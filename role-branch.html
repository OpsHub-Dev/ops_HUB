  wares:[], inv_orders:[], tsAtt:{}, tsLeaves:[], sch:{},
  pcCycleNo:1, pcArchive:[], pcBudget:0,

};

var _listeners = {};

/* ════════════════════════════════════════════════════
   CONSTANTS
════════════════════════════════════════════════════ */
var DEPTS = ['Management','Kitchen','FOH','Bar','Maintenance','Other'];
var ROLES_LIST = ['Restaurant Manager','Assistant Manager','Senior Supervisor','Supervisor','Kitchen Manager','Captain','Server','Host','Barista','Busser','Line Cook','Prep Cook','Dishwasher'];

/* ════════════════════════════════════════════════════
   DATA LOADING
════════════════════════════════════════════════════ */
function bRef(rel) { return db.ref('branches/'+sess.branchId+'/'+rel); }

function loadBranchData(keys, cb) {
  if (!db || !sess.branchId) { if(cb) cb(); return; }
  var n = keys.length, done = 0;
  if (!n) { if(cb) cb(); return; }

  keys.forEach(function(key) {
    if (BS._loaded[key]) { if(++done===n && cb) cb(); return; }
    bRef(key).once('value', function(s) {
      var val = s.val();
      if (Array.isArray(BS[key])) {
        BS[key] = val ? Object.values(val).filter(Boolean) : [];
      } else if (typeof BS[key] === 'object' && BS[key] !== null) {
        BS[key] = val || {};
      } else {
        BS[key] = val;
      }
      BS._loaded[key] = true;
      if (++done===n && cb) cb();
    });
  });
}

/* Attach live listener for a collection */
function listenBranch(key) {
  if (_listeners[key]) return;
  _listeners[key] = bRef(key).on('value', function(s) {
    var val = s.val();
    BS[key] = Array.isArray(BS[key]) ? (val ? Object.values(val).filter(Boolean) : []) : (val||{});
    BS._loaded[key] = true;
    // Re-render current page if it uses this key
    if (NX.page && PAGE_DEPS[NX.page] && PAGE_DEPS[NX.page].indexOf(key) >= 0) {
      renderCurrentPage();
    }
  });
}

// Map: page → which collections it needs live
var PAGE_DEPS = {
  'sales':       ['sales'],
  'petty-cash':  ['pc'],
  'wastage':     ['waste','wares'],
  'staff':       ['staff'],
  'inv-items':   ['wares'],
  'inv-orders':  ['inv_orders'],
  'health-cards':['health'],
  'timesheet':   ['tsAtt','staff'],
  'schedule':    ['sch','staff'],
  'bm-leave':    ['tsLeaves','staff'],
  'bm-invoices': ['invoices']
};

function renderCurrentPage() {
  if (NX.page && PAGES[NX.page]) {
    var html = PAGES[NX.page]();
    var pa = document.getElementById('page-area');
    if (pa && html) pa.innerHTML = html;
  }
}

/* ════════════════════════════════════════════════════
   NAVIGATION
════════════════════════════════════════════════════ */
function navTo(pageId) {
  NX.page = pageId;
  setActiveSiItem(pageId);

  var pa = document.getElementById('page-area');
  if (!pa) return;

  // Loading indicator
  pa.innerHTML = '<div style="text-align:center;padding:60px"><div class="spin" style="margin:0 auto 14px"></div><div style="font-size:10px;color:var(--text-3)">Loading…</div></div>';

  var deps = PAGE_DEPS[pageId] || [];
  var toLoad = deps.filter(function(k){ return !BS._loaded[k]; });

  function render() {
    var fn = PAGES[pageId];
    if (fn) {
      pa.innerHTML = fn() || '<div class="empty">Page content will appear here.</div>';
    } else {
      pa.innerHTML = '<div class="empty">Page "'+pageId+'" coming soon.</div>';
    }
    // Attach live listeners for this page
    deps.forEach(function(k){ listenBranch(k); });
  }

  if (toLoad.length) {
    loadBranchData(toLoad, render);
  } else {
    render();
  }
}

/* ════════════════════════════════════════════════════
   UTILITY FUNCTIONS
════════════════════════════════════════════════════ */
function bxe(s) { return xe(s); }
function bfsar(n) { return fmtSAR(n); }
function bfdate(s) { return fmtDate(s); }
function bpl(txt, color) {
  return '<span style="background:'+color+'22;color:'+color+';padding:2px 6px;border-radius:10px;font-size:9px;font-weight:700">'+bxe(txt)+'</span>';
}
function bmatch(item, fields) {
  var q = (BS._q||'').toLowerCase();
  if (!q) return true;
  return fields.some(function(f){ return (item[f]||'').toLowerCase().includes(q); });
}
function bfloat(n) { return parseFloat(n)||0; }

/* ════════════════════════════════════════════════════
   PAGE RENDERERS
════════════════════════════════════════════════════ */
var PAGES = {};

/* ── DASHBOARD ── */
PAGES['branch-dash'] = function() {
  var totalSales = BS.sales.reduce(function(s,x){ return s+bfloat(x.netSales||x.total||0); }, 0);
  var todaySales = BS.sales.filter(function(x){ return x.date===today(); })
    .reduce(function(s,x){ return s+bfloat(x.netSales||x.total||0); }, 0);
  var pcTotal = BS.pc.reduce(function(s,x){ return s+bfloat(x.amount||0); }, 0);
  var staffCount = BS.staff.filter(function(x){ return x.status==='Active'||!x.status; }).length;
  var wasteTotal = BS.waste.reduce(function(s,x){ return s+bfloat(x.cost||0); }, 0);
  var pendingPC = BS.pc.filter(function(x){ return (x.cycleNo||1)===BS.pcCycleNo; }).length;

  return '<div class="page-header"><div><div class="page-title">Branch Dashboard</div><div class="page-title-sub">'+bxe(sess.branchName||'')+'</div></div>'+
    '<button class="btn btn-p" onclick="navTo(\'sales\')">+ New Sale</button></div>'+

    '<div class="kpi-grid">'+
    kpi('Today Sales', bfsar(todaySales), 'vs yesterday')+
    kpi('Month Sales', bfsar(totalSales), 'all time')+
    kpi('Petty Cash', bfsar(pcTotal), pendingPC+' entries this cycle')+
    kpi('Active Staff', staffCount, 'on roster')+
    kpi('Wastage Cost', bfsar(wasteTotal), 'logged losses')+
    '</div>'+

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'+
    recentSalesCard()+
    recentWasteCard()+
    '</div>';
};

function kpi(label, value, sub) {
  return '<div class="kpi"><div class="kpi-label">'+label+'</div><div class="kpi-value">'+value+'</div>'+(sub?'<div class="kpi-sub">'+sub+'</div>':'')+
    '</div>';
}

function recentSalesCard() {
  var rows = BS.sales.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }).slice(0,5);
  return '<div class="card"><div class="card-title">Recent Sales</div>'+
    (rows.length ? '<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Net Sales</th><th>Covers</th></tr></thead><tbody>'+
    rows.map(function(s){ return '<tr><td>'+bfdate(s.date)+'</td><td style="color:var(--success);font-weight:700">'+bfsar(s.netSales||s.total||0)+'</td><td>'+(s.covers||'—')+'</td></tr>'; }).join('')+
    '</tbody></table></div>' : '<div class="empty" style="padding:20px">No sales yet</div>')+
    '</div>';
}

function recentWasteCard() {
  var rows = BS.waste.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }).slice(0,5);
  return '<div class="card"><div class="card-title">Recent Wastage</div>'+
    (rows.length ? '<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Item</th><th>Cost</th></tr></thead><tbody>'+
    rows.map(function(w){ return '<tr><td>'+bfdate(w.date)+'</td><td>'+bxe(w.item||w.itemName||'—')+'</td><td style="color:var(--danger)">'+bfsar(w.cost||0)+'</td></tr>'; }).join('')+
    '</tbody></table></div>' : '<div class="empty" style="padding:20px">No wastage logged</div>')+
    '</div>';
}

/* ── SALES ── */
PAGES['sales'] = function() {
  var sorted = BS.sales.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  var total = sorted.reduce(function(s,x){ return s+bfloat(x.netSales||x.total||0); }, 0);

  return '<div class="page-header"><div class="page-title">Sales</div>'+
    '<button class="btn btn-p" onclick="openSaleModal()">+ Add Sale</button></div>'+

    '<div class="kpi-grid">'+
    kpi('Total Sales', bfsar(total), sorted.length+' entries')+
    kpi('Entries', sorted.length, 'all time')+
    '</div>'+

    '<div class="card"><div class="tbl-wrap"><table><thead><tr>'+
    '<th>Date</th><th>Net Sales</th><th>Covers</th><th>Void</th><th>Remarks</th><th></th>'+
    '</tr></thead><tbody>'+
    (sorted.length ? sorted.map(function(s,i){
      return '<tr>'+
        '<td>'+bfdate(s.date)+'</td>'+
        '<td style="color:var(--success);font-weight:700">'+bfsar(s.netSales||s.total||0)+'</td>'+
        '<td>'+(s.covers||'—')+'</td>'+
        '<td style="color:var(--danger)">'+bfsar(s.voidTotal||0)+'</td>'+
        '<td style="color:var(--text-3)">'+bxe(s.remarks||'')+'</td>'+
        '<td><button class="btn btn-sm" onclick="deleteSale(\''+bxe(s.id||'')+'\')" style="color:var(--danger)">Del</button></td>'+
        '</tr>';
    }).join('') : '<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--text-3)">No sales recorded yet</td></tr>')+
    '</tbody></table></div></div>'+
    '<div id="sale-modal"></div>';
};

function openSaleModal(existing) {
  var e = existing || {};
  document.getElementById('sale-modal').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)closeSaleModal()">'+
    '<div class="modal">'+
    '<div class="modal-title">'+(!e.id?'New Sale Entry':'Edit Sale')+
    '<button class="modal-close" onclick="closeSaleModal()">×</button></div>'+
    '<div class="form-row">'+
    '<div class="form-field"><label>Date</label><input type="date" id="sm-date" value="'+(e.date||today())+'"></div>'+
    '<div class="form-field"><label>Net Sales (SAR)</label><input type="number" id="sm-net" value="'+(e.netSales||e.total||0)+'" step="0.01"></div>'+
    '</div>'+
    '<div class="form-row">'+
    '<div class="form-field"><label>Covers</label><input type="number" id="sm-cov" value="'+(e.covers||0)+'"></div>'+
    '<div class="form-field"><label>Void Total (SAR)</label><input type="number" id="sm-void" value="'+(e.voidTotal||0)+'" step="0.01"></div>'+
    '</div>'+
    '<div class="form-field" style="margin-bottom:12px"><label>Remarks</label><textarea id="sm-rem" rows="2">'+(e.remarks||'')+'</textarea></div>'+
    '<div style="display:flex;gap:8px">'+
    '<button class="btn btn-p" onclick="saveSale(\''+bxe(e.id||'')+'\')">Save</button>'+
    '<button class="btn" onclick="closeSaleModal()">Cancel</button>'+
    '</div></div></div>';
}

function closeSaleModal() {
  var m = document.getElementById('sale-modal');
  if(m) m.innerHTML='';
}

function bgv(id) { var el=document.getElementById(id); return el?el.value:''; }

function saveSale(existingId) {
  var rec = {
    id:        existingId || uid(),
    date:      bgv('sm-date'),
    netSales:  parseFloat(bgv('sm-net'))||0,
    covers:    parseInt(bgv('sm-cov'))||0,
    voidTotal: parseFloat(bgv('sm-void'))||0,
    remarks:   bgv('sm-rem'),
    savedAt:   Date.now(),
    branchId:  sess.branchId
  };
  if (!rec.date) { showToast('Date required','error'); return; }

  if (existingId) {
    var idx = BS.sales.findIndex(function(s){ return s.id===existingId; });
    if (idx>=0) BS.sales[idx]=rec; else BS.sales.push(rec);
  } else {
    BS.sales.push(rec);
  }

  var saveObj = {};
  BS.sales.forEach(function(s){ saveObj[s.id]=s; });
  bRef('sales').set(saveObj);
  closeSaleModal();
  showToast('Sale saved','success');
  navTo('sales');
}

function deleteSale(id) {
  if (!id||!confirm('Delete this sale entry?')) return;
  BS.sales = BS.sales.filter(function(s){ return s.id!==id; });
  var saveObj = {};
  BS.sales.forEach(function(s){ saveObj[s.id]=s; });
  bRef('sales').set(saveObj);
  showToast('Deleted');
  navTo('sales');
}

/* ── PETTY CASH ── */
PAGES['petty-cash'] = function() {
  var cycle = BS.pcCycleNo||1;
  var entries = BS.pc.filter(function(p){ return (p.cycleNo||1)===cycle; });
  var total = entries.reduce(function(s,p){ return s+bfloat(p.amount); }, 0);
  var budget = bfloat(BS.pcBudget||0);
  var pct = budget>0 ? Math.min(100,total/budget*100) : 0;
  var barColor = pct>=90?'var(--danger)':pct>=70?'var(--warning)':'var(--success)';

  return '<div class="page-header"><div><div class="page-title">Petty Cash</div><div class="page-title-sub">Cycle #'+cycle+'</div></div>'+
    '<div style="display:flex;gap:8px">'+
    '<button class="btn btn-p" onclick="openPCModal(null)">+ Add Entry</button>'+
    '<button class="btn" onclick="closeCycle()">Close Cycle</button>'+
    '</div></div>'+

    '<div class="kpi-grid">'+
    kpi('Cycle Total', bfsar(total), entries.length+' entries')+
    kpi('Budget', budget>0?bfsar(budget):'Not set', budget>0?Math.round(pct)+'% used':'')+
    '</div>'+

    (budget>0?
      '<div class="card" style="padding:12px"><div class="kpi-label">Budget Usage</div>'+
      '<div style="height:8px;background:var(--surface-3);border-radius:4px;margin-top:8px;box-shadow:var(--shadow-in)">'+
      '<div style="height:8px;width:'+pct+'%;background:'+barColor+';border-radius:4px;transition:width .3s"></div>'+
      '</div></div>':'') +

    '<div class="card"><div class="tbl-wrap"><table><thead><tr>'+
    '<th>Date</th><th>Description</th><th>For What</th><th>Category</th><th>Amount</th><th></th>'+
    '</tr></thead><tbody>'+
    (entries.length ? entries.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }).map(function(p){
      return '<tr>'+
        '<td>'+bfdate(p.date)+'</td>'+
        '<td style="font-weight:700">'+bxe(p.description||'')+'</td>'+
        '<td>'+bxe(p.forwhat||'—')+'</td>'+

function closeCycle() {
  var cycle = BS.pcCycleNo||1;
  var entries = BS.pc.filter(function(p){ return (p.cycleNo||1)===cycle; });
  var total = entries.reduce(function(s,p){ return s+bfloat(p.amount); }, 0);
  if (!confirm('Close Cycle #'+cycle+' with '+entries.length+' entries ('+fmtSAR(total)+')?\nThis will submit for Area Manager review.')) return;

  var archived = {
    id: 'pc-'+sess.branchId+'-'+cycle+'-'+Date.now(),
    cycleNo: cycle, closedAt: new Date().toISOString(),
    total: total, entries: entries.slice(),
    status:'pending_am', closedBy: sess.userName||'',
    branchId: sess.branchId, branchName: sess.branchName||''
  };

  if (!BS.pcArchive) BS.pcArchive=[];
  BS.pcArchive.push(archived);
  if (db) db.ref('admin/petty_cash_reviews/'+archived.id).set(archived);

  BS.pcCycleNo = (parseInt(cycle)||1)+1;
  bRef('pcCycleNo').set(BS.pcCycleNo);
  bRef('pcArchive').set(BS.pcArchive);
  showToast('Cycle #'+cycle+' submitted for review ✓','success');
  navTo('petty-cash');
}

    '</tr></thead><tbody>'+
    (orders.length ? orders.map(function(o){
      var sc={'Pending':'chip-y','Received':'chip-b','Approved':'chip-g','Paid':'chip-g','Overdue':'chip-r','Disputed':'chip-r'}[o.status]||'chip-n';
      return '<tr>'+
        '<td style="font-family:monospace;font-size:10px">'+bxe(o.poNumber||o.id||'—')+'</td>'+
        '<td>'+bfdate(o.date||o.createdAt)+'</td>'+
        '<td>'+bxe(o.supplier||'—')+'</td>'+
        '<td style="font-weight:700">'+bfsar(o.total||0)+'</td>'+
        '<td><span class="chip '+sc+'">'+bxe(o.status||'Pending')+'</span></td>'+
        '</tr>';
    }).join('') : '<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--text-3)">No purchase orders</td></tr>')+
    '</tbody></table></div></div>'+
    '<div id="po-modal"></div>';
};

function openPOModal() {
  document.getElementById('po-modal').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)document.getElementById(\'po-modal\').innerHTML=\'\'">'+
    '<div class="modal">'+
    '<div class="modal-title">New Purchase Order<button class="modal-close" onclick="document.getElementById(\'po-modal\').innerHTML=\'\'">×</button></div>'+
    '<div class="form-row">'+
    '<div class="form-field"><label>Supplier</label><input id="po-sup"></div>'+
    '<div class="form-field"><label>Date</label><input type="date" id="po-date" value="'+today()+'"></div>'+
    '</div>'+
    '<div class="form-row">'+
    '<div class="form-field"><label>Total (SAR)</label><input type="number" id="po-total" step="0.01" value="0"></div>'+
    '<div class="form-field"><label>Notes</label><input id="po-notes"></div>'+
    '</div>'+
    '<div style="display:flex;gap:8px;margin-top:4px">'+
    '<button class="btn btn-p" onclick="savePO()">Submit PO</button>'+
    '<button class="btn" onclick="document.getElementById(\'po-modal\').innerHTML=\'\'">Cancel</button>'+
    '</div></div></div>';
}

function savePO(){
  var rec={id:uid(),poNumber:'PO-'+Date.now().toString(36).toUpperCase(),
    supplier:bgv('po-sup'),date:bgv('po-date'),
    total:parseFloat(bgv('po-total'))||0,notes:bgv('po-notes'),
    status:'Pending',createdAt:new Date().toISOString(),branchId:sess.branchId};
  if(!rec.supplier){showToast('Supplier required','error');return;}
  if(!BS.inv_orders)BS.inv_orders=[];
  BS.inv_orders.push(rec);
  var o={};BS.inv_orders.forEach(function(p){o[p.id]=p;});
  bRef('inv_orders').set(o);
  document.getElementById('po-modal').innerHTML='';
  showToast('PO submitted','success');
  navTo('inv-orders');
}

/* ── INVOICES ── */
PAGES['bm-invoices'] = function() {
  return '<div class="page-header"><div class="page-title">Invoices</div></div>'+
    '<div class="card"><div style="text-align:center;padding:40px;color:var(--text-3)">Invoice module — coming soon.</div></div>';
};

/* ── LEAVE ── */
PAGES['bm-leave'] = function() {
  var leaves = BS.tsLeaves||[];
  return '<div class="page-header"><div class="page-title">Leave Requests</div></div>'+
    kpiRow([{l:'Total Requests', v:leaves.length, s:''},{l:'Pending',v:leaves.filter(function(l){return l.status==='Pending';}).length,s:''}])+
    '<div class="card"><div class="tbl-wrap"><table><thead><tr>'+
    '<th>Staff</th><th>Type</th><th>From</th><th>To</th><th>Status</th><th></th>'+
    '</tr></thead><tbody>'+
    (leaves.length ? leaves.map(function(l){
      var sc=l.status==='Approved'?'chip-g':l.status==='Rejected'?'chip-r':'chip-y';
      return '<tr>'+
        '<td style="font-weight:700">'+bxe(l.name||l.staffName||'—')+'</td>'+
        '<td>'+bxe(l.leaveType||l.type||'—')+'</td>'+
        '<td>'+bfdate(l.startDate||l.from)+'</td>'+
        '<td>'+bfdate(l.endDate||l.to)+'</td>'+
        '<td><span class="chip '+sc+'">'+bxe(l.status||'Pending')+'</span></td>'+
        '<td style="display:flex;gap:4px">'+
        (l.status==='Pending'?
          '<button class="btn btn-sm" style="color:var(--success)" onclick="approveLeave(\''+bxe(l.id||'')+'\',true)">✓</button>'+
          '<button class="btn btn-sm" style="color:var(--danger)" onclick="approveLeave(\''+bxe(l.id||'')+'\',false)">✗</button>':
          '')+
        '</td></tr>';
    }).join('') : '<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--text-3)">No leave requests</td></tr>')+
    '</tbody></table></div></div>';
};

function approveLeave(id, approve) {
  if (!BS.tsLeaves) return;
  var idx = BS.tsLeaves.findIndex(function(l){ return l.id===id; });
  if (idx<0) return;
  BS.tsLeaves[idx].status = approve ? 'Approved' : 'Rejected';
  BS.tsLeaves[idx].reviewedBy = sess.userName||'';
  BS.tsLeaves[idx].reviewedAt = new Date().toISOString();
  bRef('tsLeaves/'+id+'/status').set(BS.tsLeaves[idx].status);
  bRef('tsLeaves/'+id+'/reviewedBy').set(sess.userName||'');
  showToast(approve?'Leave Approved':'Leave Rejected', approve?'success':'error');
  navTo('bm-leave');
}
